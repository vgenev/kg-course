<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Knowledge Graphs Course</title>
  <style>
:root {
  --bg: #14171c;
  --bg-elevated: #1c2129;
  --bg-rail: #181c23;
  --border: #2a313c;
  --text: #d8dee8;
  --text-muted: #8b95a5;
  --accent: #e8743f;
  --accent-hover: #f08a5c;
  --correct: #4fbf7f;
  --wrong: #e0685f;
  --panel: #1a1f27;
  --sample-bg: #151a22;
  --instructions-bg: #1e2430;
  --focus-ring: rgba(232, 116, 63, 0.45);
  --font: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  --mono: ui-monospace, 'SF Mono', Menlo, Monaco, Consolas, monospace;
}

:root[data-theme='light'] {
  --bg: #eef1f5;
  --bg-elevated: #ffffff;
  --bg-rail: #e4e8ee;
  --border: #c5ccd6;
  --text: #1e2630;
  --text-muted: #5c6778;
  --accent: #c2491b;
  --accent-hover: #a33d16;
  --correct: #3a9d66;
  --wrong: #c4564f;
  --panel: #ffffff;
  --sample-bg: #f4f6f9;
  --instructions-bg: #e8ecf2;
  --focus-ring: rgba(194, 73, 27, 0.35);
}

*,
*::before,
*::after {
  box-sizing: border-box;
}

html {
  font-family: var(--font);
  font-size: 16px;
  line-height: 1.5;
  color: var(--text);
  background: var(--bg);
}

body {
  margin: 0;
  min-height: 100%;
}

.app-root {
  min-height: 100%;
  display: flex;
  flex-direction: column;
}

.app-header {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 0.75rem 1.25rem;
  padding: 0.85rem 1.25rem;
  border-bottom: 1px solid var(--border);
  background: var(--bg-elevated);
}

.brand {
  font-weight: 700;
  font-size: 0.85rem;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--accent);
}

.header-title {
  flex: 1;
  font-size: 1.05rem;
  font-weight: 600;
  min-width: 12rem;
}

.header-mastery {
  font-size: 0.9rem;
  color: var(--text-muted);
  font-variant-numeric: tabular-nums;
}

.btn-theme {
  border: 1px solid var(--border);
  background: var(--panel);
  color: var(--text);
  padding: 0.4rem 0.75rem;
  border-radius: 8px;
  cursor: pointer;
  font-size: 0.85rem;
}

.btn-theme:hover {
  border-color: var(--accent);
  color: var(--accent);
}

.app-shell {
  display: grid;
  grid-template-columns: 260px 1fr;
  flex: 1;
  align-items: start;
}

@media (max-width: 899px) {
  .app-shell {
    grid-template-columns: 1fr;
  }
}

.rail {
  background: var(--bg-rail);
  border-right: 1px solid var(--border);
  padding: 1rem 0.75rem 1.25rem;
  position: sticky;
  top: 0;
  max-height: none;
}

@media (max-width: 899px) {
  .rail {
    position: static;
    border-right: none;
    border-bottom: 1px solid var(--border);
    display: flex;
    flex-direction: row;
    flex-wrap: nowrap;
    overflow-x: auto;
    gap: 0.5rem;
    padding: 0.75rem;
  }

  .rail-nav,
  .rail-footer {
    display: contents;
  }

  .rail-item {
    flex: 0 0 auto;
    min-width: 10rem;
  }
}

.rail-nav {
  display: flex;
  flex-direction: column;
  gap: 0.25rem;
}

@media (max-width: 899px) {
  .rail-nav {
    flex-direction: row;
  }
}

.rail-item {
  display: flex;
  flex-direction: column;
  gap: 0.35rem;
  padding: 0.55rem 0.65rem;
  border-radius: 8px;
  border: none;
  background: transparent;
  color: var(--text);
  text-align: left;
  cursor: pointer;
  font: inherit;
  width: 100%;
}

.rail-item:hover {
  background: var(--bg-elevated);
}

.rail-item[aria-current='page'] {
  background: var(--panel);
  box-shadow: inset 3px 0 0 var(--accent);
}

.rail-item-label {
  display: flex;
  align-items: baseline;
  gap: 0.5rem;
  font-size: 0.88rem;
}

.rail-num {
  font-variant-numeric: tabular-nums;
  color: var(--text-muted);
  font-size: 0.8rem;
}

.meter {
  display: flex;
  gap: 2px;
}

.meter-seg {
  flex: 1;
  height: 4px;
  border-radius: 2px;
  background: var(--border);
}

.meter-seg.on {
  background: var(--accent);
}

.rail-footer {
  margin-top: 1.25rem;
  padding-top: 1rem;
  border-top: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  gap: 0.35rem;
}

@media (max-width: 899px) {
  .rail-footer {
    margin-top: 0;
    padding-top: 0;
    border-top: none;
    flex-direction: row;
  }
}

.rail-footer button,
.rail-footer label {
  font-size: 0.8rem;
  padding: 0.4rem 0.6rem;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: var(--panel);
  color: var(--text-muted);
  cursor: pointer;
  text-align: center;
}

.rail-footer button:hover,
.rail-footer label:hover {
  color: var(--accent);
  border-color: var(--accent);
}

.rail-persist-note {
  font-size: 0.75rem;
  color: var(--wrong);
  margin-top: 0.5rem;
}

.panel {
  padding: 1.5rem 1.75rem 2.5rem;
  max-width: 52rem;
}

.panel h1 {
  font-size: 1.65rem;
  margin: 0.25rem 0 0.5rem;
  font-weight: 650;
}

.kicker {
  font-size: 0.8rem;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--accent);
  margin: 0;
}

.goal {
  color: var(--text-muted);
  margin: 0 0 1.5rem;
}

.lesson h2 {
  font-size: 1.15rem;
  margin: 1.25rem 0 0.5rem;
}

.lesson p {
  margin: 0.75rem 0;
}

.lesson ul {
  margin: 0.75rem 0;
  padding-left: 1.25rem;
}

.code-block-wrap {
  position: relative;
  margin: 1rem 0;
}

.lesson pre {
  font-family: var(--mono);
  font-size: 0.82rem;
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 0.85rem 1rem;
  overflow-x: auto;
  margin: 0;
}

.btn-copy {
  position: absolute;
  top: 0.45rem;
  right: 0.45rem;
  font-size: 0.72rem;
  padding: 0.2rem 0.5rem;
  border-radius: 999px;
  border: 1px solid var(--border);
  background: var(--panel);
  color: var(--text-muted);
  cursor: pointer;
}

.btn-copy:hover {
  color: var(--accent);
}

.note-callout {
  border-left: 3px solid var(--accent);
  padding: 0.75rem 1rem;
  margin: 1rem 0;
  background: var(--instructions-bg);
  border-radius: 0 8px 8px 0;
  font-size: 0.92rem;
}

.sample-text {
  margin: 1.5rem 0;
  padding: 1rem 1.1rem;
  border-left: 4px solid var(--accent);
  background: var(--sample-bg);
  border-radius: 0 12px 12px 0;
}

.sample-text h3 {
  margin: 0 0 0.5rem;
  font-size: 0.85rem;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

.sample-text pre {
  font-family: var(--mono);
  font-size: 0.85rem;
  margin: 0;
  white-space: pre-wrap;
}

.instructions-panel {
  margin: 1.75rem 0;
  padding: 1.1rem 1.25rem;
  background: var(--instructions-bg);
  border: 1px solid var(--border);
  border-radius: 12px;
}

.instructions-panel h2 {
  margin: 0 0 0.75rem;
  font-size: 1rem;
}

.instructions-panel ol {
  margin: 0;
  padding-left: 1.25rem;
}

.instructions-panel li {
  margin: 0.4rem 0;
}

.exercise-card {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 1.15rem 1.25rem;
  margin: 1.25rem 0;
}

.exercise-card.flash-outline {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

@media (prefers-reduced-motion: no-preference) {
  .exercise-card.flash-outline {
    animation: flash 1.2s ease;
  }
}

@keyframes flash {
  0%,
  100% {
    outline-color: transparent;
  }
  30% {
    outline-color: var(--focus-ring);
  }
}

.exercise-meta {
  font-size: 0.78rem;
  color: var(--text-muted);
  margin-bottom: 0.5rem;
}

.exercise-prompt {
  font-weight: 550;
  margin-bottom: 0.85rem;
}

.option-row {
  display: block;
  width: 100%;
  text-align: left;
  padding: 0.55rem 0.75rem;
  margin: 0.35rem 0;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--bg-elevated);
  color: var(--text);
  cursor: pointer;
  font: inherit;
}

.option-row:hover:not(:disabled) {
  border-color: var(--accent);
}

.option-row:disabled {
  cursor: default;
  opacity: 0.85;
}

.option-row.selected {
  border-color: var(--accent);
  box-shadow: inset 0 0 0 1px var(--accent);
}

.check-row {
  display: flex;
  align-items: flex-start;
  gap: 0.55rem;
  margin: 0.35rem 0;
  cursor: pointer;
}

.check-row input {
  margin-top: 0.25rem;
  accent-color: var(--accent);
}

.triples-area {
  width: 100%;
  font-family: var(--mono);
  font-size: 0.82rem;
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 0.65rem;
  background: var(--bg-elevated);
  color: var(--text);
  resize: vertical;
}

.hint-line {
  font-size: 0.82rem;
  color: var(--text-muted);
  margin-top: 0.35rem;
  font-family: var(--mono);
}

.categorize-item {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 0.5rem;
  margin: 0.65rem 0;
  padding: 0.5rem 0;
  border-bottom: 1px solid var(--border);
}

.categorize-item:last-child {
  border-bottom: none;
}

.bucket-btn {
  font-size: 0.75rem;
  padding: 0.3rem 0.55rem;
  border-radius: 999px;
  border: 1px solid var(--border);
  background: var(--bg-elevated);
  color: var(--text-muted);
  cursor: pointer;
}

.bucket-btn.active {
  border-color: var(--accent);
  color: var(--accent);
  background: var(--instructions-bg);
}

.order-wrap {
  display: flex;
  flex-direction: column;
  gap: 0.75rem;
}

.order-pool,
.order-seq {
  display: flex;
  flex-wrap: wrap;
  gap: 0.4rem;
}

.order-step {
  font-size: 0.82rem;
  padding: 0.4rem 0.65rem;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: var(--bg-elevated);
  color: var(--text);
  cursor: pointer;
  text-align: left;
}

.order-seq .order-step::before {
  content: attr(data-pos) '. ';
  color: var(--accent);
  font-weight: 600;
}

.cloze-input {
  font: inherit;
  border: none;
  border-bottom: 2px solid var(--accent);
  background: transparent;
  color: var(--text);
  min-width: 6rem;
  padding: 0.1rem 0.25rem;
}

.num-input {
  font: inherit;
  font-family: var(--mono);
  padding: 0.45rem 0.65rem;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--bg-elevated);
  color: var(--text);
  width: 8rem;
}

.btn-check,
.btn-secondary {
  margin-top: 0.75rem;
  padding: 0.45rem 1rem;
  border-radius: 8px;
  border: 1px solid var(--accent);
  background: var(--accent);
  color: var(--bg);
  font-weight: 600;
  cursor: pointer;
  font-size: 0.88rem;
}

.btn-secondary {
  background: transparent;
  color: var(--accent);
  margin-left: 0.5rem;
}

.btn-check:hover,
.btn-secondary:hover {
  background: var(--accent-hover);
  border-color: var(--accent-hover);
  color: var(--bg);
}

.feedback {
  margin-top: 1rem;
  padding: 0.85rem 1rem;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: var(--bg-elevated);
}

.verdict-bar {
  font-weight: 600;
  margin-bottom: 0.5rem;
}

.verdict-bar.correct {
  color: var(--correct);
}

.verdict-bar.partial {
  color: var(--accent);
}

.verdict-bar.wrong {
  color: var(--wrong);
}

.feedback-line {
  margin: 0.35rem 0 0.35rem 0.75rem;
  padding-left: 0.65rem;
  border-left: 2px solid var(--border);
  font-size: 0.9rem;
  color: var(--text-muted);
}

.completion-strip {
  margin: 2rem 0 1rem;
  padding: 1rem 1.25rem;
  border-radius: 12px;
  border: 1px solid var(--border);
  background: var(--instructions-bg);
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 1rem;
}

.stats-row {
  display: flex;
  flex-wrap: wrap;
  gap: 1rem 2rem;
  margin: 1.25rem 0;
  font-size: 0.9rem;
}

.stats-row span {
  color: var(--text-muted);
}

.stats-row strong {
  color: var(--text);
  font-variant-numeric: tabular-nums;
}

.module-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(15rem, 1fr));
  gap: 1rem;
  margin-top: 1.5rem;
}

.module-card {
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 1rem;
  background: var(--panel);
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
}

.module-card .btn-open {
  align-self: flex-start;
  margin-top: 0.5rem;
}

.review-group {
  margin: 1.25rem 0;
}

.review-group h3 {
  font-size: 0.9rem;
  color: var(--text-muted);
  margin-bottom: 0.5rem;
}

.review-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 0.75rem;
  padding: 0.5rem 0;
  border-bottom: 1px solid var(--border);
  font-size: 0.88rem;
}

.log-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.8rem;
}

.log-table th,
.log-table td {
  border: 1px solid var(--border);
  padding: 0.45rem 0.5rem;
  text-align: left;
  vertical-align: top;
}

.log-table th {
  background: var(--bg-elevated);
  color: var(--text-muted);
}

.empty-state {
  color: var(--text-muted);
  padding: 2rem 0;
}

.drill-progress {
  font-size: 0.85rem;
  color: var(--text-muted);
  margin-bottom: 1rem;
}

.hidden-input {
  position: absolute;
  width: 0;
  height: 0;
  opacity: 0;
  overflow: hidden;
}

  </style>
</head>
<body>
  <div id="app" class="app-root"></div>
  <script>
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();
  else root.KGGrader = factory();
})(typeof globalThis !== 'undefined' ? globalThis : this, function () {
  function normalize(str) {
    let s = String(str);
    s = s.normalize('NFD').replace(/[\u0300-\u036f]/g, '');
    s = s.toLowerCase().replace(/[_-]+/g, ' ');
    s = s.replace(/[^a-z0-9 %]/g, '');
    s = s.replace(/\s+/g, ' ').trim();
    if (s.startsWith('the ')) s = s.slice(4);
    return s;
  }

  function round2(n) {
    return Math.round(n * 100) / 100;
  }

  function verdictFromScore(score) {
    if (score >= 1) return 'correct';
    if (score > 0) return 'partial';
    return 'wrong';
  }

  function gradeMcq(exercise, answer) {
    const idx = answer;
    const correct = idx === exercise.answer;
    const score = correct ? 1 : 0;
    const lines = [];
    if (!correct) {
      const w = exercise.wrong[idx];
      if (w) lines.push(w);
    }
    return {
      score,
      max: 1,
      verdict: verdictFromScore(score),
      why: exercise.why,
      lines,
      detail: { selected: idx, correct: exercise.answer },
    };
  }

  function gradeMulti(exercise, answer) {
    const selected = Array.isArray(answer) ? answer.map(Number) : [];
    const answers = exercise.answers.map(Number);
    const selSet = new Set(selected);
    const ansSet = new Set(answers);
    let hits = 0;
    for (const i of selSet) {
      if (ansSet.has(i)) hits++;
    }
    let extra = 0;
    for (const i of selSet) {
      if (!ansSet.has(i)) extra++;
    }
    const missed = answers.filter((i) => !selSet.has(i));
    const raw = Math.max(0, hits - extra) / answers.length;
    const score = round2(raw);
    const lines = [];
    for (const i of missed) {
      lines.push('Missed: ' + exercise.options[i]);
      if (exercise.notes[i]) lines.push(exercise.notes[i]);
    }
    for (const i of selected) {
      if (!ansSet.has(i)) {
        lines.push('Wrongly included: ' + exercise.options[i]);
        if (exercise.notes[i]) lines.push(exercise.notes[i]);
      }
    }
    return {
      score,
      max: 1,
      verdict: verdictFromScore(score),
      why: exercise.why,
      lines,
      detail: { hits, extra, missed, selected },
    };
  }

  function parseTripleLine(line) {
    let parts = line.split(/\s*\|\s*/);
    if (parts.length !== 3) {
      parts = line.split('\t');
    }
    parts = parts.map((p) => p.trim()).filter((p) => p.length > 0);
    if (parts.length !== 3) return null;
    return parts;
  }

  function aliasSet(aliases) {
    const set = new Set();
    for (const a of aliases) set.add(normalize(a));
    return set;
  }

  function tripleMatches(parsed, expected) {
    const sSet = aliasSet(expected.s);
    const pSet = aliasSet(expected.p);
    const oSet = aliasSet(expected.o);
    return (
      sSet.has(normalize(parsed[0])) &&
      pSet.has(normalize(parsed[1])) &&
      oSet.has(normalize(parsed[2]))
    );
  }

  function gradeTriples(exercise, answer) {
    const raw = String(answer || '');
    const rawLines = raw.split(/\r?\n/);
    const parsed = [];
    const parseErrors = [];
    const unmatchedRaw = [];

    for (let i = 0; i < rawLines.length; i++) {
      const trimmed = rawLines[i].trim();
      if (!trimmed || trimmed.startsWith('#')) continue;
      const triple = parseTripleLine(trimmed);
      if (!triple) {
        parseErrors.push({ lineNum: i + 1, raw: trimmed });
      } else {
        parsed.push({ triple, raw: trimmed, used: false });
      }
    }

    const expected = exercise.expected;
    let matched = 0;
    const missing = [];

    for (const exp of expected) {
      let found = false;
      for (const row of parsed) {
        if (row.used) continue;
        if (tripleMatches(row.triple, exp)) {
          row.used = true;
          found = true;
          matched++;
          break;
        }
      }
      if (!found) {
        missing.push(exp);
      }
    }

    for (const row of parsed) {
      if (!row.used) unmatchedRaw.push(row.raw);
    }
    for (const err of parseErrors) {
      unmatchedRaw.push(err.raw);
    }

    const inputLines = parsed.length + parseErrors.length;
    const rawScore =
      (matched - 0.5 * (inputLines - matched)) / expected.length;
    const score = round2(Math.max(0, rawScore));

    const outLines = [];
    if (score < 1) {
      for (const err of parseErrors) {
        outLines.push(
          'Line ' + err.lineNum + ' is not subject | predicate | object'
        );
      }
      for (const exp of missing) {
        outLines.push(
          'Missing: ' + exp.s[0] + ' | ' + exp.p[0] + ' | ' + exp.o[0]
        );
      }
      for (const rawLine of unmatchedRaw) {
        if (parseErrors.some((e) => e.raw === rawLine)) continue;
        outLines.push('Not in the source: ' + rawLine);
      }
    }

    return {
      score,
      max: 1,
      verdict: verdictFromScore(score),
      why: exercise.why,
      lines: outLines,
      detail: {
        matched,
        expected: expected.length,
        parsed: parsed.map((r) => r.triple),
        missing,
        extra: unmatchedRaw,
        parseErrors,
      },
    };
  }

  function gradeCategorize(exercise, answer) {
    const map = answer && typeof answer === 'object' ? answer : {};
    const items = exercise.items;
    let correct = 0;
    const lines = [];
    for (let i = 0; i < items.length; i++) {
      const chosen = map[i] !== undefined ? Number(map[i]) : -1;
      const expected = items[i].bucket;
      if (chosen === expected) {
        correct++;
      } else {
        const chosenLabel =
          chosen >= 0 && chosen < exercise.buckets.length
            ? exercise.buckets[chosen]
            : '(none)';
        lines.push(
          items[i].text +
            ': you chose ' +
            chosenLabel +
            ', correct is ' +
            exercise.buckets[expected]
        );
        if (items[i].note) lines.push(items[i].note);
      }
    }
    const score = round2(correct / items.length);
    return {
      score,
      max: 1,
      verdict: verdictFromScore(score),
      why: exercise.why,
      lines,
      detail: { correct, total: items.length },
    };
  }

  function gradeOrder(exercise, answer) {
    const n = exercise.items.length;
    const expectedSeq = [];
    for (let i = 0; i < n; i++) expectedSeq.push(i);
    const user = Array.isArray(answer) ? answer.map(Number) : [];
    const ok =
      user.length === n &&
      user.every((v, i) => v === expectedSeq[i]);
    const score = ok ? 1 : 0;
    const lines = [];
    if (!ok) {
      const parts = exercise.items.map(
        (t, i) => (i + 1) + ') ' + t
      );
      lines.push('Correct order: ' + parts.join(' '));
    }
    return {
      score,
      max: 1,
      verdict: verdictFromScore(score),
      why: exercise.why,
      lines,
      detail: { user, expected: expectedSeq },
    };
  }

  function blankCorrect(blank, value) {
    const nv = normalize(value);
    if (!nv) return false;
    for (const a of blank.accept) {
      const na = normalize(a);
      if (nv === na) return true;
      if (nv.length >= 4 && na.includes(nv)) return true;
    }
    return false;
  }

  function gradeCloze(exercise, answer) {
    const vals = Array.isArray(answer) ? answer : [];
    const blanks = exercise.blanks;
    let correct = 0;
    const lines = [];
    for (let i = 0; i < blanks.length; i++) {
      const v = vals[i] != null ? String(vals[i]) : '';
      if (blankCorrect(blanks[i], v)) {
        correct++;
      } else {
        const first = blanks[i].accept[0];
        const note = blanks[i].note ? ' ' + blanks[i].note : '';
        lines.push(
          "Blank " +
            (i + 1) +
            ": you wrote '" +
            v +
            "'. Accepted: " +
            first +
            '.' +
            note
        );
      }
    }
    const score = round2(correct / blanks.length);
    return {
      score,
      max: 1,
      verdict: verdictFromScore(score),
      why: exercise.why,
      lines,
      detail: { correct, total: blanks.length },
    };
  }

  function gradeNumeric(exercise, answer) {
    const cleaned = String(answer || '')
      .replace(/%/g, '')
      .replace(/,/g, '')
      .replace(/\s/g, '');
    let v = parseFloat(cleaned);
    if (Number.isNaN(v)) {
      return {
        score: 0,
        max: 1,
        verdict: 'wrong',
        why: exercise.why,
        lines: [],
        detail: { parsed: NaN },
      };
    }
    if (v > 1) v = v / 100;
    const ok = Math.abs(v - exercise.answer) <= exercise.tolerance;
    const score = ok ? 1 : 0;
    return {
      score,
      max: 1,
      verdict: verdictFromScore(score),
      why: exercise.why,
      lines: [],
      detail: { parsed: v, expected: exercise.answer },
    };
  }

  function grade(exercise, answer) {
    const type = exercise.type;
    switch (type) {
      case 'mcq':
        return gradeMcq(exercise, answer);
      case 'multi':
        return gradeMulti(exercise, answer);
      case 'triples':
        return gradeTriples(exercise, answer);
      case 'categorize':
        return gradeCategorize(exercise, answer);
      case 'order':
        return gradeOrder(exercise, answer);
      case 'cloze':
        return gradeCloze(exercise, answer);
      case 'numeric':
        return gradeNumeric(exercise, answer);
      default:
        throw new Error('unknown exercise type: ' + type);
    }
  }

  return {
    normalize,
    grade,
  };
});

(function () {
  const grader = window.KGGrader;
  const STORAGE_KEY = 'kg-course-v1';

  let persistOk = true;
  let state = defaultState();
  const cardState = {};
  let view = { kind: 'overview' };
  let drill = null;
  let focusExerciseId = null;

  function defaultState() {
    return { v: 1, rec: {}, log: [], theme: 'dark' };
  }

  function loadState() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        const parsed = JSON.parse(raw);
        if (parsed && parsed.v === 1) {
          state = {
            v: 1,
            rec: parsed.rec || {},
            log: Array.isArray(parsed.log) ? parsed.log : [],
            theme: parsed.theme === 'light' ? 'light' : 'dark',
          };
        }
      }
    } catch (_) {
      persistOk = false;
    }
    document.documentElement.setAttribute('data-theme', state.theme);
  }

  function saveState() {
    if (!persistOk) return;
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    } catch (_) {
      persistOk = false;
      render();
    }
  }

  function allExercises() {
    return COURSE.modules.flatMap((m) =>
      m.exercises.map((e) => ({ module: m, exercise: e }))
    );
  }

  function findExercise(id) {
    for (const m of COURSE.modules) {
      const ex = m.exercises.find((e) => e.id === id);
      if (ex) return { module: m, exercise: ex };
    }
    return null;
  }

  function recFor(id) {
    return state.rec[id] || { best: 0, attempts: 0, last: 0 };
  }

  function moduleMastery(mod) {
    const scores = mod.exercises.map((e) => recFor(e.id).best);
    if (!scores.length) return 0;
    const mean = scores.reduce((a, b) => a + b, 0) / scores.length;
    return mean;
  }

  function meterOnCount(mean) {
    return Math.round(mean * 8);
  }

  function overallMastery() {
    const all = allExercises();
    if (!all.length) return 0;
    const sum = all.reduce((s, { exercise }) => s + recFor(exercise.id).best, 0);
    return sum / all.length;
  }

  function stats() {
    const all = allExercises();
    const total = all.length;
    let solved = 0;
    let attempted = 0;
    let weakest = null;
    let weakestVal = 2;
    for (const m of COURSE.modules) {
      const mm = moduleMastery(m);
      if (mm < weakestVal) {
        weakestVal = mm;
        weakest = m;
      }
      for (const e of m.exercises) {
        const r = recFor(e.id);
        if (r.best >= 1) solved++;
        if (r.attempts > 0) attempted++;
      }
    }
    return {
      total,
      solved,
      attempted,
      meanPct: Math.round(overallMastery() * 100),
      weakest,
    };
  }

  function reviewList() {
    return allExercises().filter(({ exercise }) => recFor(exercise.id).best < 1);
  }

  function defaultDraft(ex) {
    switch (ex.type) {
      case 'mcq':
        return null;
      case 'multi':
        return [];
      case 'triples':
        return '';
      case 'categorize':
        return {};
      case 'order':
        return [];
      case 'cloze':
        return ex.blanks.map(() => '');
      case 'numeric':
        return '';
      default:
        return null;
    }
  }

  function getCard(id, ex) {
    if (!cardState[id]) {
      cardState[id] = {
        draft: defaultDraft(ex),
        result: null,
        locked: false,
        showAnswer: false,
      };
    }
    return cardState[id];
  }

  function recordGrade(exercise, answer, result) {
    const id = exercise.id;
    const prev = recFor(id);
    const best = Math.max(prev.best, result.score);
    state.rec[id] = {
      best,
      attempts: prev.attempts + 1,
      last: Date.now(),
    };
    if (result.score < 1) {
      state.log.push({
        id,
        score: result.score,
        given: answer,
        at: Date.now(),
      });
      if (state.log.length > 200) {
        state.log = state.log.slice(-200);
      }
    }
    saveState();
  }

  function verdictLabel(v) {
    if (v === 'correct') return 'Correct';
    if (v === 'partial') return 'Partly right';
    return 'Not right yet';
  }

  function escapeHtml(s) {
    return String(s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function el(tag, attrs, children) {
    const node = document.createElement(tag);
    if (attrs) {
      for (const [k, v] of Object.entries(attrs)) {
        if (k === 'className') node.className = v;
        else if (k === 'text') node.textContent = v;
        else if (k.startsWith('on') && typeof v === 'function') {
          node.addEventListener(k.slice(2).toLowerCase(), v);
        } else if (v != null) node.setAttribute(k, v);
      }
    }
    if (children != null) {
      const list = Array.isArray(children) ? children : [children];
      for (const c of list) {
        if (c == null) continue;
        if (typeof c === 'string') node.appendChild(document.createTextNode(c));
        else node.appendChild(c);
      }
    }
    return node;
  }

  function renderFeedback(container, result, exercise, card) {
    const panel = el('div', { className: 'feedback', role: 'status' });
    const bar = el('div', {
      className: 'verdict-bar ' + result.verdict,
      text:
        verdictLabel(result.verdict) +
        ' (' +
        Math.round(result.score * 100) +
        '%)',
    });
    panel.appendChild(bar);
    panel.appendChild(el('p', { text: result.why }));
    for (const line of result.lines) {
      panel.appendChild(el('p', { className: 'feedback-line', text: line }));
    }
    if (result.score < 1) {
      const tryBtn = el('button', {
        type: 'button',
        className: 'btn-secondary',
        text: 'Try again',
      });
      tryBtn.addEventListener('click', () => {
        card.result = null;
        card.locked = false;
        card.showAnswer = false;
        if (exercise.type !== 'mcq') card.draft = defaultDraft(exercise);
        render();
      });
      panel.appendChild(tryBtn);
    }
    if (
      (exercise.type === 'triples' || exercise.type === 'cloze') &&
      !card.showAnswer
    ) {
      const showBtn = el('button', {
        type: 'button',
        className: 'btn-secondary',
        text: 'Show answer',
      });
      showBtn.addEventListener('click', () => {
        card.showAnswer = true;
        render();
      });
      panel.appendChild(showBtn);
    }
    if (card.showAnswer) {
      const ans = el('div', { className: 'hint-line' });
      if (exercise.type === 'triples') {
        const lines = exercise.expected.map(
          (t) => t.s[0] + ' | ' + t.p[0] + ' | ' + t.o[0]
        );
        ans.textContent = lines.join('\n');
      } else if (exercise.type === 'cloze') {
        ans.textContent = exercise.blanks
          .map((b) => b.accept[0])
          .join(', ');
      }
      panel.appendChild(ans);
    }
    container.appendChild(panel);
  }

  function gradeCard(exercise, card) {
    const result = grader.grade(exercise, card.draft);
    card.result = result;
    recordGrade(exercise, card.draft, result);
    render();
  }

  function renderExerciseControls(exercise, card, wrap) {
    const t = exercise.type;
    if (t === 'mcq') {
      exercise.options.forEach((opt, i) => {
        const btn = el('button', {
          type: 'button',
          className:
            'option-row' +
            (card.draft === i ? ' selected' : ''),
          disabled: card.locked ? 'true' : null,
        });
        btn.textContent = opt;
        btn.addEventListener('click', () => {
          if (card.locked) return;
          card.draft = i;
          card.locked = true;
          gradeCard(exercise, card);
        });
        wrap.appendChild(btn);
      });
    } else if (t === 'multi') {
      exercise.options.forEach((opt, i) => {
        const row = el('label', { className: 'check-row' });
        const cb = document.createElement('input');
        cb.type = 'checkbox';
        cb.checked = card.draft.includes(i);
        cb.addEventListener('change', () => {
          if (cb.checked) {
            if (!card.draft.includes(i)) card.draft.push(i);
          } else {
            card.draft = card.draft.filter((x) => x !== i);
          }
        });
        row.appendChild(cb);
        row.appendChild(document.createTextNode(opt));
        wrap.appendChild(row);
      });
      const chk = el('button', {
        type: 'button',
        className: 'btn-check',
        text: 'Check',
      });
      chk.addEventListener('click', () => gradeCard(exercise, card));
      wrap.appendChild(chk);
    } else if (t === 'triples') {
      const ta = el('textarea', {
        className: 'triples-area',
        rows: '6',
        placeholder: exercise.format,
      });
      ta.value = card.draft;
      ta.addEventListener('input', () => {
        card.draft = ta.value;
      });
      wrap.appendChild(ta);
      wrap.appendChild(
        el('div', {
          className: 'hint-line',
          text: 'Example: ' + exercise.example,
        })
      );
      if (exercise.hint) {
        wrap.appendChild(el('div', { className: 'hint-line', text: exercise.hint }));
      }
      wrap.appendChild(
        el('button', {
          type: 'button',
          className: 'btn-check',
          text: 'Check',
          onClick: () => gradeCard(exercise, card),
        })
      );
    } else if (t === 'categorize') {
      exercise.items.forEach((item, i) => {
        const row = el('div', { className: 'categorize-item' });
        row.appendChild(el('span', { text: item.text }));
        exercise.buckets.forEach((b, bi) => {
          const bb = el('button', {
            type: 'button',
            className:
              'bucket-btn' + (card.draft[i] === bi ? ' active' : ''),
            text: b,
          });
          bb.addEventListener('click', () => {
            card.draft[i] = bi;
            render();
          });
          row.appendChild(bb);
        });
        wrap.appendChild(row);
      });
      wrap.appendChild(
        el('button', {
          type: 'button',
          className: 'btn-check',
          text: 'Check',
          onClick: () => gradeCard(exercise, card),
        })
      );
    } else if (t === 'order') {
      const ow = el('div', { className: 'order-wrap' });
      const pool = el('div', { className: 'order-pool' });
      const seq = el('div', { className: 'order-seq' });
      const inSeq = new Set(card.draft);
      exercise.items.forEach((text, i) => {
        if (!inSeq.has(i)) {
          const b = el('button', {
            type: 'button',
            className: 'order-step',
            text: text,
          });
          b.addEventListener('click', () => {
            card.draft.push(i);
            render();
          });
          pool.appendChild(b);
        }
      });
      card.draft.forEach((idx, pos) => {
        const b = el('button', {
          type: 'button',
          className: 'order-step',
          'data-pos': String(pos + 1),
          text: exercise.items[idx],
        });
        b.addEventListener('click', () => {
          card.draft = card.draft.filter((x) => x !== idx);
          render();
        });
        seq.appendChild(b);
      });
      ow.appendChild(el('div', { text: 'Available steps' }));
      ow.appendChild(pool);
      ow.appendChild(el('div', { text: 'Your sequence' }));
      ow.appendChild(seq);
      wrap.appendChild(ow);
      wrap.appendChild(
        el('button', {
          type: 'button',
          className: 'btn-check',
          text: 'Check',
          onClick: () => gradeCard(exercise, card),
        })
      );
    } else if (t === 'cloze') {
      const parts = exercise.sentence.split('______');
      const line = el('p', { className: 'cloze-sentence' });
      line.appendChild(document.createTextNode(parts[0] || ''));
      const inp = el('input', {
        className: 'cloze-input',
        type: 'text',
        value: card.draft[0] || '',
      });
      inp.addEventListener('input', () => {
        card.draft[0] = inp.value;
      });
      line.appendChild(inp);
      line.appendChild(document.createTextNode(parts[1] || ''));
      wrap.appendChild(line);
      wrap.appendChild(
        el('button', {
          type: 'button',
          className: 'btn-check',
          text: 'Check',
          onClick: () => gradeCard(exercise, card),
        })
      );
    } else if (t === 'numeric') {
      const inp = el('input', {
        className: 'num-input',
        type: 'text',
        inputmode: 'decimal',
        value: card.draft,
      });
      inp.addEventListener('input', () => {
        card.draft = inp.value;
      });
      wrap.appendChild(inp);
      if (exercise.hint) {
        wrap.appendChild(el('div', { className: 'hint-line', text: exercise.hint }));
      }
      wrap.appendChild(
        el('button', {
          type: 'button',
          className: 'btn-check',
          text: 'Check',
          onClick: () => gradeCard(exercise, card),
        })
      );
    }
    if (card.result) renderFeedback(wrap, card.result, exercise, card);
  }

  function renderLesson(lesson, container) {
    const box = el('div', { className: 'lesson' });
    for (const block of lesson) {
      if (block.t === 'p') {
        box.appendChild(el('p', { text: block.x }));
      } else if (block.t === 'h') {
        box.appendChild(el('h2', { text: block.x }));
      } else if (block.t === 'ul') {
        const ul = el('ul');
        for (const li of block.x) ul.appendChild(el('li', { text: li }));
        box.appendChild(ul);
      } else if (block.t === 'code') {
        const wrap = el('div', { className: 'code-block-wrap' });
        const pre = el('pre', { text: block.x });
        const copy = el('button', {
          type: 'button',
          className: 'btn-copy',
          text: 'Copy',
        });
        copy.addEventListener('click', () => {
          navigator.clipboard.writeText(block.x).catch(() => {});
        });
        wrap.appendChild(pre);
        wrap.appendChild(copy);
        box.appendChild(wrap);
      } else if (block.t === 'note') {
        box.appendChild(el('div', { className: 'note-callout', text: block.x }));
      }
    }
    container.appendChild(box);
  }

  function renderInstructions(instructions, container) {
    const panel = el('div', { className: 'instructions-panel' });
    panel.appendChild(el('h2', { text: 'Instructions' }));
    const ol = el('ol');
    for (const line of instructions) {
      ol.appendChild(el('li', { text: line }));
    }
    panel.appendChild(ol);
    container.appendChild(panel);
  }

  function renderModule(mod, container) {
    container.appendChild(el('p', { className: 'kicker', text: mod.kicker }));
    container.appendChild(el('h1', { text: mod.title }));
    container.appendChild(el('p', { className: 'goal', text: mod.goal }));
    renderLesson(mod.lesson, container);
    if (mod.text) {
      const st = el('div', { className: 'sample-text' });
      st.appendChild(el('h3', { text: 'Sample text' }));
      st.appendChild(el('pre', { text: mod.text.body }));
      container.appendChild(st);
    }
    if (mod.instructions && mod.instructions.length) {
      renderInstructions(mod.instructions, container);
    }
    const n = mod.exercises.length;
    mod.exercises.forEach((exercise, idx) => {
      const card = getCard(exercise.id, exercise);
      const cardEl = el('article', {
        className:
          'exercise-card' +
          (focusExerciseId === exercise.id ? ' flash-outline' : ''),
        id: 'ex-' + exercise.id,
      });
      cardEl.appendChild(
        el('div', {
          className: 'exercise-meta',
          text: 'Item ' + (idx + 1) + ' of ' + n,
        })
      );
      if (exercise.type !== 'cloze') {
        cardEl.appendChild(
          el('div', { className: 'exercise-prompt', text: exercise.prompt })
        );
      }
      const controls = el('div', { className: 'exercise-controls' });
      renderExerciseControls(exercise, card, controls);
      cardEl.appendChild(controls);
      container.appendChild(cardEl);
    });
    const mm = Math.round(moduleMastery(mod) * 100);
    const strip = el('div', { className: 'completion-strip' });
    strip.appendChild(
      el('span', { text: 'Part mastery: ' + mm + '%' })
    );
    const next = COURSE.modules.find((m) => m.num === mod.num + 1);
    if (next) {
      strip.appendChild(
        el('button', {
          type: 'button',
          className: 'btn-check',
          text: 'Next part',
          onClick: () => {
            view = { kind: 'module', id: next.id };
            render();
          },
        })
      );
    }
    container.appendChild(strip);
  }

  function renderOverview(container) {
    container.appendChild(el('h1', { text: COURSE.course.title }));
    container.appendChild(
      el('p', { className: 'goal', text: COURSE.course.subtitle })
    );
    container.appendChild(el('h2', { text: 'How this works' }));
    const ul = el('ul');
    for (const h of COURSE.course.howto) {
      ul.appendChild(el('li', { text: h }));
    }
    container.appendChild(ul);
    const st = stats();
    const row = el('div', { className: 'stats-row' });
    const mkStat = (label, value) => {
      const s = el('span');
      s.appendChild(document.createTextNode(label + ' '));
      const strong = el('strong', { text: value });
      s.appendChild(strong);
      return s;
    };
    row.appendChild(
      mkStat('Items solved:', st.solved + '/' + st.total)
    );
    row.appendChild(mkStat('Mean mastery:', st.meanPct + '%'));
    row.appendChild(mkStat('Items attempted:', String(st.attempted)));
    if (st.weakest) {
      row.appendChild(mkStat('Weakest part:', 'Part ' + st.weakest.num));
    }
    container.appendChild(row);
    const grid = el('div', { className: 'module-grid' });
    for (const m of COURSE.modules) {
      const mm = Math.round(moduleMastery(m) * 100);
      const anyAttempt = m.exercises.some((e) => recFor(e.id).attempts > 0);
      const card = el('div', { className: 'module-card' });
      card.appendChild(
        el('div', {
          className: 'rail-num',
          text: String(m.num).padStart(2, '0'),
        })
      );
      card.appendChild(el('strong', { text: m.title }));
      card.appendChild(el('span', { text: m.kicker }));
      card.appendChild(el('p', { text: m.goal }));
      card.appendChild(
        el('span', {
          text: anyAttempt ? 'Mastery ' + mm + '%' : 'Not started',
        })
      );
      card.appendChild(
        el('button', {
          type: 'button',
          className: 'btn-check btn-open',
          text: 'Open',
          onClick: () => {
            view = { kind: 'module', id: m.id };
            render();
          },
        })
      );
      grid.appendChild(card);
    }
    container.appendChild(grid);
  }

  function renderReview(container) {
    const weak = reviewList();
    if (!weak.length) {
      container.appendChild(
        el('div', {
          className: 'empty-state',
          text: 'Nothing below a perfect score. Your review list is empty.',
        })
      );
      return;
    }
    container.appendChild(el('h1', { text: 'Review' }));
    container.appendChild(
      el('button', {
        type: 'button',
        className: 'btn-check',
        text: 'Start drill',
        onClick: () => {
          const items = weak.slice(0, 10).map((w) => w.exercise.id);
          drill = { ids: items, index: 0, done: false };
          view = { kind: 'drill' };
          render();
        },
      })
    );
    const byMod = {};
    for (const { module, exercise } of weak) {
      if (!byMod[module.id]) byMod[module.id] = { module, items: [] };
      byMod[module.id].items.push(exercise);
    }
    for (const m of COURSE.modules) {
      const g = byMod[m.id];
      if (!g) continue;
      const grp = el('div', { className: 'review-group' });
      grp.appendChild(
        el('h3', {
          text: 'Part ' + String(m.num).padStart(2, '0') + ': ' + m.title,
        })
      );
      for (const exercise of g.items) {
        const row = el('div', { className: 'review-row' });
        const prompt =
          exercise.prompt.length > 90
            ? exercise.prompt.slice(0, 87) + '...'
            : exercise.prompt;
        row.appendChild(el('span', { text: prompt }));
        row.appendChild(
          el('span', {
            text: Math.round(recFor(exercise.id).best * 100) + '%',
          })
        );
        row.appendChild(
          el('button', {
            type: 'button',
            className: 'btn-secondary',
            text: 'Practise',
            onClick: () => {
              view = { kind: 'module', id: m.id };
              focusExerciseId = exercise.id;
              render();
              requestAnimationFrame(() => {
                const elx = document.getElementById('ex-' + exercise.id);
                if (elx) elx.scrollIntoView({ behavior: 'smooth', block: 'center' });
                setTimeout(() => {
                  focusExerciseId = null;
                }, 1500);
              });
            },
          })
        );
        grp.appendChild(row);
      }
      container.appendChild(grp);
    }
  }

  function advanceDrill(result) {
    if (!drill) return;
    if (!drill.summary) drill.summary = [];
    drill.summary.push(result.score);
    if (drill.index + 1 >= drill.ids.length) drill.done = true;
    else drill.index++;
    render();
  }

  function renderDrill(container) {
    if (!drill || drill.done) {
      container.appendChild(el('h1', { text: 'Drill complete' }));
      const scores = (drill && drill.summary) || [];
      const avg =
        scores.length
          ? Math.round(
              (scores.reduce((a, b) => a + b, 0) / scores.length) * 100
            )
          : 0;
      container.appendChild(
        el('p', { text: 'Average score this drill: ' + avg + '%' })
      );
      container.appendChild(
        el('button', {
          type: 'button',
          className: 'btn-check',
          text: 'Back to review',
          onClick: () => {
            drill = null;
            view = { kind: 'review' };
            render();
          },
        })
      );
      return;
    }
    const id = drill.ids[drill.index];
    const found = findExercise(id);
    if (!found) {
      drill.done = true;
      render();
      return;
    }
    container.appendChild(
      el('div', {
        className: 'drill-progress',
        text:
          'Drill ' +
          (drill.index + 1) +
          ' of ' +
          drill.ids.length,
      })
    );
    const card = getCard(found.exercise.id, found.exercise);
    card.result = null;
    card.locked = false;
    const wrap = el('article', { className: 'exercise-card' });
    wrap.appendChild(
      el('div', { className: 'exercise-prompt', text: found.exercise.prompt })
    );
    const controls = el('div');
    const ex = found.exercise;
    const t = ex.type;
    if (t === 'mcq') {
      ex.options.forEach((opt, i) => {
        const btn = el('button', { type: 'button', className: 'option-row' });
        btn.textContent = opt;
        btn.addEventListener('click', () => {
          const result = grader.grade(ex, i);
          recordGrade(ex, i, result);
          advanceDrill(result);
        });
        controls.appendChild(btn);
      });
    } else {
      renderExerciseControls(ex, card, controls);
      const chk = controls.querySelector('.btn-check');
      if (chk) {
        chk.addEventListener('click', (ev) => {
          ev.stopPropagation();
          const result = grader.grade(ex, card.draft);
          recordGrade(ex, card.draft, result);
          advanceDrill(result);
        });
      }
    }
    wrap.appendChild(controls);
    container.appendChild(wrap);
  }

  function renderErrorLog(container) {
    container.appendChild(el('h1', { text: 'Error log' }));
    if (!state.log.length) {
      container.appendChild(
        el('div', {
          className: 'empty-state',
          text: 'No misses logged yet.',
        })
      );
      return;
    }
    const table = el('table', { className: 'log-table' });
    const head = el('tr');
    for (const h of ['Time', 'Part', 'Item', 'Score', 'Given', 'Why']) {
      head.appendChild(el('th', { text: h }));
    }
    table.appendChild(el('thead', null, head));
    const tbody = el('tbody');
    const logs = state.log.slice().reverse();
    for (const entry of logs) {
      const found = findExercise(entry.id);
      const modNum = found ? found.module.num : '?';
      let givenStr = '';
      try {
        givenStr = JSON.stringify(entry.given);
      } catch (_) {
        givenStr = String(entry.given);
      }
      if (givenStr.length > 120) givenStr = givenStr.slice(0, 117) + '...';
      const why = found ? found.exercise.why : '';
      const tr = el('tr');
      tr.appendChild(
        el('td', {
          text: new Date(entry.at).toLocaleString(),
        })
      );
      tr.appendChild(el('td', { text: String(modNum) }));
      tr.appendChild(el('td', { text: entry.id }));
      tr.appendChild(
        el('td', { text: Math.round(entry.score * 100) + '%' })
      );
      tr.appendChild(el('td', { text: givenStr }));
      tr.appendChild(el('td', { text: why }));
      tbody.appendChild(tr);
    }
    table.appendChild(tbody);
    container.appendChild(table);
  }

  function railMeter(mean) {
    const on = meterOnCount(mean);
    const segs = [];
    for (let i = 0; i < 8; i++) {
      segs.push(el('div', { className: 'meter-seg' + (i < on ? ' on' : '') }));
    }
    return el('div', { className: 'meter' }, segs);
  }

  function renderRail(root) {
    const rail = el('aside', { className: 'rail' });
    const nav = el('nav', { className: 'rail-nav', 'aria-label': 'Course' });

    const ov = el('button', {
      type: 'button',
      className: 'rail-item',
      'aria-current': view.kind === 'overview' ? 'page' : null,
    });
    ov.appendChild(el('span', { className: 'rail-item-label', text: 'Overview' }));
    ov.addEventListener('click', () => {
      view = { kind: 'overview' };
      drill = null;
      render();
    });
    nav.appendChild(ov);

    for (const m of COURSE.modules) {
      const mm = moduleMastery(m);
      const btn = el('button', {
        type: 'button',
        className: 'rail-item',
        'aria-current':
          view.kind === 'module' && view.id === m.id ? 'page' : null,
      });
      const label = el('span', { className: 'rail-item-label' });
      label.appendChild(
        el('span', {
          className: 'rail-num',
          text: String(m.num).padStart(2, '0'),
        })
      );
      label.appendChild(document.createTextNode(m.title));
      btn.appendChild(label);
      btn.appendChild(railMeter(mm));
      btn.addEventListener('click', () => {
        view = { kind: 'module', id: m.id };
        drill = null;
        render();
      });
      nav.appendChild(btn);
    }

    const weakN = reviewList().length;
    const rev = el('button', {
      type: 'button',
      className: 'rail-item',
      'aria-current': view.kind === 'review' || view.kind === 'drill' ? 'page' : null,
    });
    rev.appendChild(
      el('span', {
        className: 'rail-item-label',
        text: 'Review (' + weakN + ')',
      })
    );
    rev.addEventListener('click', () => {
      view = { kind: 'review' };
      drill = null;
      render();
    });
    nav.appendChild(rev);

    const logN = state.log.length;
    const logBtn = el('button', {
      type: 'button',
      className: 'rail-item',
      'aria-current': view.kind === 'log' ? 'page' : null,
    });
    logBtn.appendChild(
      el('span', {
        className: 'rail-item-label',
        text: 'Error log (' + logN + ')',
      })
    );
    logBtn.addEventListener('click', () => {
      view = { kind: 'log' };
      drill = null;
      render();
    });
    nav.appendChild(logBtn);

    rail.appendChild(nav);

    const foot = el('div', { className: 'rail-footer' });
    foot.appendChild(
      el('button', {
        type: 'button',
        text: 'Export',
        onClick: () => {
          const blob = new Blob([JSON.stringify(state, null, 2)], {
            type: 'application/json',
          });
          const a = document.createElement('a');
          a.href = URL.createObjectURL(blob);
          a.download = 'kg-course-progress.json';
          a.click();
          URL.revokeObjectURL(a.href);
        },
      })
    );
    const importLabel = el('label', { text: 'Import' });
    const importInput = el('input', {
      type: 'file',
      accept: 'application/json,.json',
      className: 'hidden-input',
    });
    importInput.addEventListener('change', () => {
      const file = importInput.files && importInput.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const parsed = JSON.parse(reader.result);
          if (!confirm('Replace all progress with the imported file?')) return;
          state = {
            v: 1,
            rec: parsed.rec || {},
            log: parsed.log || [],
            theme: parsed.theme === 'light' ? 'light' : 'dark',
          };
          document.documentElement.setAttribute('data-theme', state.theme);
          saveState();
          render();
        } catch (_) {
          alert('Could not read that file.');
        }
      };
      reader.readAsText(file);
    });
    importLabel.appendChild(importInput);
    foot.appendChild(importLabel);
    foot.appendChild(
      el('button', {
        type: 'button',
        text: 'Reset',
        onClick: () => {
          if (!confirm('Clear all progress on this machine?')) return;
          state = defaultState();
          document.documentElement.setAttribute('data-theme', state.theme);
          saveState();
          render();
        },
      })
    );
    rail.appendChild(foot);

    if (!persistOk) {
      rail.appendChild(
        el('p', {
          className: 'rail-persist-note',
          text: 'Progress will not persist here',
        })
      );
    }

    root.appendChild(rail);
  }

  function render() {
    const root = document.getElementById('app');
    root.innerHTML = '';
    root.className = 'app-root';

    const header = el('header', { className: 'app-header' });
    header.appendChild(el('span', { className: 'brand', text: 'KG Course' }));
    header.appendChild(
      el('span', {
        className: 'header-title',
        text: COURSE.course.title,
      })
    );
    const om = Math.round(overallMastery() * 100);
    header.appendChild(
      el('span', {
        className: 'header-mastery',
        text: 'Mastery ' + om + '%',
      })
    );
    const themeBtn = el('button', {
      type: 'button',
      className: 'btn-theme',
      text: state.theme === 'dark' ? 'Light mode' : 'Dark mode',
    });
    themeBtn.addEventListener('click', () => {
      state.theme = state.theme === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', state.theme);
      saveState();
      render();
    });
    header.appendChild(themeBtn);
    root.appendChild(header);

    const shell = el('div', { className: 'app-shell' });
    renderRail(shell);
    const panel = el('main', { className: 'panel' });

    if (view.kind === 'overview') renderOverview(panel);
    else if (view.kind === 'module') {
      const mod = COURSE.modules.find((m) => m.id === view.id);
      if (mod) renderModule(mod, panel);
    } else if (view.kind === 'review') renderReview(panel);
    else if (view.kind === 'log') renderErrorLog(panel);
    else if (view.kind === 'drill') renderDrill(panel);

    shell.appendChild(panel);
    root.appendChild(shell);
  }

  loadState();
  render();
})();

  </script>
</body>
</html>
