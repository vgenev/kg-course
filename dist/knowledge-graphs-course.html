<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Knowledge Graphs Course</title>
  <style>
:root {
  --bg: #14171c;
  --bg-elevated: #1c2129;
  --bg-rail: #181c23;
  --border: #2a313c;
  --text: #d8dee8;
  --text-muted: #8b95a5;
  --accent: #e8743f;
  --accent-hover: #f08a5c;
  --correct: #4fbf7f;
  --wrong: #e0685f;
  --panel: #1a1f27;
  --sample-bg: #151a22;
  --instructions-bg: #1e2430;
  --focus-ring: rgba(232, 116, 63, 0.45);
  --font: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  --mono: ui-monospace, 'SF Mono', Menlo, Monaco, Consolas, monospace;
}

:root[data-theme='light'] {
  --bg: #eef1f5;
  --bg-elevated: #ffffff;
  --bg-rail: #e4e8ee;
  --border: #c5ccd6;
  --text: #1e2630;
  --text-muted: #5c6778;
  --accent: #c2491b;
  --accent-hover: #a33d16;
  --correct: #3a9d66;
  --wrong: #c4564f;
  --panel: #ffffff;
  --sample-bg: #f4f6f9;
  --instructions-bg: #e8ecf2;
  --focus-ring: rgba(194, 73, 27, 0.35);
}

*,
*::before,
*::after {
  box-sizing: border-box;
}

html {
  font-family: var(--font);
  font-size: 16px;
  line-height: 1.5;
  color: var(--text);
  background: var(--bg);
}

body {
  margin: 0;
  min-height: 100%;
}

.app-root {
  min-height: 100%;
  display: flex;
  flex-direction: column;
}

.app-header {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 0.75rem 1.25rem;
  padding: 0.85rem 1.25rem;
  border-bottom: 1px solid var(--border);
  background: var(--bg-elevated);
}

.brand {
  font-weight: 700;
  font-size: 0.85rem;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--accent);
}

.header-title {
  flex: 1;
  font-size: 1.05rem;
  font-weight: 600;
  min-width: 12rem;
}

.header-mastery {
  font-size: 0.9rem;
  color: var(--text-muted);
  font-variant-numeric: tabular-nums;
}

.btn-theme {
  border: 1px solid var(--border);
  background: var(--panel);
  color: var(--text);
  padding: 0.4rem 0.75rem;
  border-radius: 8px;
  cursor: pointer;
  font-size: 0.85rem;
}

.btn-theme:hover {
  border-color: var(--accent);
  color: var(--accent);
}

.app-shell {
  display: grid;
  grid-template-columns: 260px 1fr;
  flex: 1;
  align-items: start;
}

@media (max-width: 899px) {
  .app-shell {
    grid-template-columns: 1fr;
  }
}

.rail {
  background: var(--bg-rail);
  border-right: 1px solid var(--border);
  padding: 1rem 0.75rem 1.25rem;
  position: sticky;
  top: 0;
  max-height: none;
}

@media (max-width: 899px) {
  .rail {
    position: static;
    border-right: none;
    border-bottom: 1px solid var(--border);
    display: flex;
    flex-direction: row;
    flex-wrap: nowrap;
    overflow-x: auto;
    gap: 0.5rem;
    padding: 0.75rem;
  }

  .rail-nav,
  .rail-footer {
    display: contents;
  }

  .rail-item {
    flex: 0 0 auto;
    min-width: 10rem;
  }
}

.rail-nav {
  display: flex;
  flex-direction: column;
  gap: 0.25rem;
}

@media (max-width: 899px) {
  .rail-nav {
    flex-direction: row;
  }
}

.rail-item {
  display: flex;
  flex-direction: column;
  gap: 0.35rem;
  padding: 0.55rem 0.65rem;
  border-radius: 8px;
  border: none;
  background: transparent;
  color: var(--text);
  text-align: left;
  cursor: pointer;
  font: inherit;
  width: 100%;
}

.rail-item:hover {
  background: var(--bg-elevated);
}

.rail-item[aria-current='page'] {
  background: var(--panel);
  box-shadow: inset 3px 0 0 var(--accent);
}

.rail-item-label {
  display: flex;
  align-items: baseline;
  gap: 0.5rem;
  font-size: 0.88rem;
}

.rail-num {
  font-variant-numeric: tabular-nums;
  color: var(--text-muted);
  font-size: 0.8rem;
}

.rail-phase-header {
  display: flex;
  flex-direction: column;
  gap: 0.15rem;
  padding: 0.85rem 0.65rem 0.35rem;
  margin-top: 0.35rem;
  pointer-events: none;
}

.rail-phase-header:first-of-type {
  margin-top: 0;
}

.rail-phase-label {
  font-size: 0.72rem;
  font-variant: small-caps;
  letter-spacing: 0.04em;
  color: var(--text-muted);
  font-weight: 600;
}

.rail-phase-note {
  font-size: 0.68rem;
  font-variant: small-caps;
  letter-spacing: 0.02em;
  color: var(--text-muted);
  opacity: 0.85;
  line-height: 1.35;
}

.meter {
  display: flex;
  gap: 2px;
}

.meter-seg {
  flex: 1;
  height: 4px;
  border-radius: 2px;
  background: var(--border);
}

.meter-seg.on {
  background: var(--accent);
}

.rail-footer {
  margin-top: 1.25rem;
  padding-top: 1rem;
  border-top: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  gap: 0.35rem;
}

@media (max-width: 899px) {
  .rail-footer {
    margin-top: 0;
    padding-top: 0;
    border-top: none;
    flex-direction: row;
  }
}

.rail-footer button,
.rail-footer label {
  font-size: 0.8rem;
  padding: 0.4rem 0.6rem;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: var(--panel);
  color: var(--text-muted);
  cursor: pointer;
  text-align: center;
}

.rail-footer button:hover,
.rail-footer label:hover {
  color: var(--accent);
  border-color: var(--accent);
}

.rail-persist-note {
  font-size: 0.75rem;
  color: var(--wrong);
  margin-top: 0.5rem;
}

.panel {
  padding: 1.5rem 1.75rem 2.5rem;
  max-width: 52rem;
}

.panel h1 {
  font-size: 1.65rem;
  margin: 0.25rem 0 0.5rem;
  font-weight: 650;
}

.kicker {
  font-size: 0.8rem;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--accent);
  margin: 0;
}

.goal {
  color: var(--text-muted);
  margin: 0 0 1.5rem;
}

.lesson h2 {
  font-size: 1.15rem;
  margin: 1.25rem 0 0.5rem;
}

.lesson p {
  margin: 0.75rem 0;
}

.lesson ul {
  margin: 0.75rem 0;
  padding-left: 1.25rem;
}

.code-block-wrap {
  position: relative;
  margin: 1rem 0;
}

.lesson pre {
  font-family: var(--mono);
  font-size: 0.82rem;
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 0.85rem 1rem;
  overflow-x: auto;
  margin: 0;
}

.btn-copy {
  position: absolute;
  top: 0.45rem;
  right: 0.45rem;
  font-size: 0.72rem;
  padding: 0.2rem 0.5rem;
  border-radius: 999px;
  border: 1px solid var(--border);
  background: var(--panel);
  color: var(--text-muted);
  cursor: pointer;
}

.btn-copy:hover {
  color: var(--accent);
}

.note-callout {
  border-left: 3px solid var(--accent);
  padding: 0.75rem 1rem;
  margin: 1rem 0;
  background: var(--instructions-bg);
  border-radius: 0 8px 8px 0;
  font-size: 0.92rem;
}

.sample-text {
  margin: 1.5rem 0;
  padding: 1rem 1.1rem;
  border-left: 4px solid var(--accent);
  background: var(--sample-bg);
  border-radius: 0 12px 12px 0;
}

.sample-text h3 {
  margin: 0 0 0.5rem;
  font-size: 0.85rem;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

.sample-text pre {
  font-family: var(--mono);
  font-size: 0.85rem;
  margin: 0;
  white-space: pre-wrap;
}

.instructions-panel {
  margin: 1.75rem 0;
  padding: 1.1rem 1.25rem;
  background: var(--instructions-bg);
  border: 1px solid var(--border);
  border-radius: 12px;
}

.instructions-panel h2 {
  margin: 0 0 0.75rem;
  font-size: 1rem;
}

.instructions-panel ol {
  margin: 0;
  padding-left: 1.25rem;
}

.instructions-panel li {
  margin: 0.4rem 0;
}

.exercise-card {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 1.15rem 1.25rem;
  margin: 1.25rem 0;
}

.exercise-card.flash-outline {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

@media (prefers-reduced-motion: no-preference) {
  .exercise-card.flash-outline {
    animation: flash 1.2s ease;
  }
}

@keyframes flash {
  0%,
  100% {
    outline-color: transparent;
  }
  30% {
    outline-color: var(--focus-ring);
  }
}

.exercise-meta {
  font-size: 0.78rem;
  color: var(--text-muted);
  margin-bottom: 0.5rem;
}

.exercise-prompt {
  font-weight: 550;
  margin-bottom: 0.85rem;
}

.option-row {
  display: block;
  width: 100%;
  text-align: left;
  padding: 0.55rem 0.75rem;
  margin: 0.35rem 0;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--bg-elevated);
  color: var(--text);
  cursor: pointer;
  font: inherit;
}

.option-row:hover:not(:disabled) {
  border-color: var(--accent);
}

.option-row:disabled {
  cursor: default;
  opacity: 0.85;
}

.option-row.selected {
  border-color: var(--accent);
  box-shadow: inset 0 0 0 1px var(--accent);
}

.check-row {
  display: flex;
  align-items: flex-start;
  gap: 0.55rem;
  margin: 0.35rem 0;
  cursor: pointer;
}

.check-row input {
  margin-top: 0.25rem;
  accent-color: var(--accent);
}

.triples-area {
  width: 100%;
  font-family: var(--mono);
  font-size: 0.82rem;
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 0.65rem;
  background: var(--bg-elevated);
  color: var(--text);
  resize: vertical;
}

.hint-line {
  font-size: 0.82rem;
  color: var(--text-muted);
  margin-top: 0.35rem;
  font-family: var(--mono);
}

.categorize-item {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 0.5rem;
  margin: 0.65rem 0;
  padding: 0.5rem 0;
  border-bottom: 1px solid var(--border);
}

.categorize-item:last-child {
  border-bottom: none;
}

.bucket-btn {
  font-size: 0.75rem;
  padding: 0.3rem 0.55rem;
  border-radius: 999px;
  border: 1px solid var(--border);
  background: var(--bg-elevated);
  color: var(--text-muted);
  cursor: pointer;
}

.bucket-btn.active {
  border-color: var(--accent);
  color: var(--accent);
  background: var(--instructions-bg);
}

.order-wrap {
  display: flex;
  flex-direction: column;
  gap: 0.75rem;
}

.order-pool,
.order-seq {
  display: flex;
  flex-wrap: wrap;
  gap: 0.4rem;
}

.order-step {
  font-size: 0.82rem;
  padding: 0.4rem 0.65rem;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: var(--bg-elevated);
  color: var(--text);
  cursor: pointer;
  text-align: left;
}

.order-seq .order-step::before {
  content: attr(data-pos) '. ';
  color: var(--accent);
  font-weight: 600;
}

.cloze-input {
  font: inherit;
  border: none;
  border-bottom: 2px solid var(--accent);
  background: transparent;
  color: var(--text);
  min-width: 6rem;
  padding: 0.1rem 0.25rem;
}

.num-input {
  font: inherit;
  font-family: var(--mono);
  padding: 0.45rem 0.65rem;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--bg-elevated);
  color: var(--text);
  width: 8rem;
}

.btn-check,
.btn-secondary {
  margin-top: 0.75rem;
  padding: 0.45rem 1rem;
  border-radius: 8px;
  border: 1px solid var(--accent);
  background: var(--accent);
  color: var(--bg);
  font-weight: 600;
  cursor: pointer;
  font-size: 0.88rem;
}

.btn-secondary {
  background: transparent;
  color: var(--accent);
  margin-left: 0.5rem;
}

.btn-check:hover,
.btn-secondary:hover {
  background: var(--accent-hover);
  border-color: var(--accent-hover);
  color: var(--bg);
}

.feedback {
  margin-top: 1rem;
  padding: 0.85rem 1rem;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: var(--bg-elevated);
}

.verdict-bar {
  font-weight: 600;
  margin-bottom: 0.5rem;
}

.verdict-bar.correct {
  color: var(--correct);
}

.verdict-bar.partial {
  color: var(--accent);
}

.verdict-bar.wrong {
  color: var(--wrong);
}

.feedback-line {
  margin: 0.35rem 0 0.35rem 0.75rem;
  padding-left: 0.65rem;
  border-left: 2px solid var(--border);
  font-size: 0.9rem;
  color: var(--text-muted);
}

.completion-strip {
  margin: 2rem 0 1rem;
  padding: 1rem 1.25rem;
  border-radius: 12px;
  border: 1px solid var(--border);
  background: var(--instructions-bg);
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 1rem;
}

.stats-row {
  display: flex;
  flex-wrap: wrap;
  gap: 1rem 2rem;
  margin: 1.25rem 0;
  font-size: 0.9rem;
}

.stats-row span {
  color: var(--text-muted);
}

.stats-row strong {
  color: var(--text);
  font-variant-numeric: tabular-nums;
}

.course-source {
  margin: 0.75rem 0 0;
  font-size: 0.78rem;
  color: var(--text-muted);
}

.phase-heading {
  margin-top: 1.75rem;
}

.phase-heading:first-of-type {
  margin-top: 1.25rem;
}

.phase-heading h2 {
  font-size: 0.85rem;
  font-variant: small-caps;
  letter-spacing: 0.04em;
  color: var(--text-muted);
  font-weight: 600;
  margin: 0 0 0.25rem;
}

.phase-heading p {
  font-size: 0.8rem;
  color: var(--text-muted);
  margin: 0;
  opacity: 0.9;
}

.module-meta {
  font-size: 0.88rem;
  color: var(--text-muted);
  margin: -0.25rem 0 1.25rem;
}

.module-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(15rem, 1fr));
  gap: 1rem;
  margin-top: 0.75rem;
  margin-bottom: 0.5rem;
}

.module-card {
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 1rem;
  background: var(--panel);
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
}

.module-card .btn-open {
  align-self: flex-start;
  margin-top: 0.5rem;
}

.review-group {
  margin: 1.25rem 0;
}

.review-group h3 {
  font-size: 0.9rem;
  color: var(--text-muted);
  margin-bottom: 0.5rem;
}

.review-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 0.75rem;
  padding: 0.5rem 0;
  border-bottom: 1px solid var(--border);
  font-size: 0.88rem;
}

.log-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.8rem;
}

.log-table th,
.log-table td {
  border: 1px solid var(--border);
  padding: 0.45rem 0.5rem;
  text-align: left;
  vertical-align: top;
}

.log-table th {
  background: var(--bg-elevated);
  color: var(--text-muted);
}

.empty-state {
  color: var(--text-muted);
  padding: 2rem 0;
}

.drill-progress {
  font-size: 0.85rem;
  color: var(--text-muted);
  margin-bottom: 1rem;
}

.hidden-input {
  position: absolute;
  width: 0;
  height: 0;
  opacity: 0;
  overflow: hidden;
}

.btn-scratch[aria-pressed='true'] {
  border-color: var(--accent);
  color: var(--accent);
  box-shadow: inset 0 0 0 1px var(--accent);
}

@media (min-width: 1200px) {
  .app-root.scratch-wide {
    max-width: 1680px;
    margin-left: auto;
    margin-right: auto;
  }

  .app-shell.scratch-open {
    grid-template-columns: 260px 1fr 420px;
  }

  .app-shell.scratch-open .panel {
    max-width: none;
  }
}

.scratch-column {
  display: none;
  background: var(--bg-rail);
  border-left: 1px solid var(--border);
}

@media (min-width: 1200px) {
  .scratch-column {
    display: flex;
    flex-direction: column;
    position: sticky;
    top: 0;
    align-self: stretch;
    width: 420px;
    max-width: 420px;
    height: calc(100dvh - 3.75rem);
    min-height: 0;
  }

  .scratch-column-inner {
    display: flex;
    flex-direction: column;
    flex: 1;
    min-height: 0;
    overflow: hidden;
    padding: 1rem 0.85rem 1.25rem;
  }

  .scratch-in-panel,
  .scratch-block {
    display: none;
  }
}

.scratch-block {
  margin-bottom: 1.5rem;
  padding: 1rem 1.1rem;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 12px;
}

@media (max-width: 1199px) {
  .scratch-column {
    display: none !important;
  }
}

.scratch-heading {
  margin: 0 0 0.65rem;
  font-size: 0.95rem;
  font-weight: 600;
}

.scratch-widget {
  display: flex;
  flex-direction: column;
  gap: 0.65rem;
  min-height: 0;
}

.scratch-toolbar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 0.35rem;
}

.scratch-tool-btn {
  border: 1px solid var(--border);
  background: var(--panel);
  color: var(--text);
  padding: 0.3rem 0.55rem;
  border-radius: 8px;
  cursor: pointer;
  font-size: 0.75rem;
  font-family: inherit;
}

.scratch-tool-btn:hover {
  border-color: var(--accent);
  color: var(--accent);
}

.scratch-tool-btn[aria-pressed='true'] {
  border-color: var(--accent);
  color: var(--accent);
  box-shadow: inset 0 0 0 1px var(--accent);
}

.scratch-swatches {
  display: flex;
  gap: 0.35rem;
  margin-left: 0.15rem;
}

.scratch-swatch {
  width: 1.35rem;
  height: 1.35rem;
  border-radius: 8px;
  border: 2px solid var(--border);
  padding: 0;
  cursor: pointer;
}

.scratch-swatch-ink {
  background: var(--text);
}

.scratch-swatch-accent {
  background: var(--accent);
}

.scratch-swatch-muted {
  background: var(--text-muted);
}

.scratch-swatch[aria-pressed='true'] {
  border-color: var(--accent);
  box-shadow: 0 0 0 1px var(--accent);
}

.scratch-persist-note {
  flex: 1 1 100%;
  margin: 0.25rem 0 0;
  font-size: 0.72rem;
  color: var(--wrong);
}

.scratch-canvas-wrap {
  position: relative;
  flex: 1 1 auto;
  min-height: 342px;
  border: 1px solid var(--border);
  border-radius: 12px;
  overflow: hidden;
  background-color: var(--bg);
  background-image: radial-gradient(
    circle,
    color-mix(in srgb, var(--border) 55%, transparent) 1px,
    transparent 1px
  );
  background-size: 18px 18px;
  background-position: 0 0;
}

.scratch-block .scratch-canvas-wrap {
  flex: none;
  max-height: 60vh;
}

.scratch-canvas {
  display: block;
  touch-action: none;
  cursor: crosshair;
}

.scratch-column-inner .scratch-widget {
  flex: 1;
  min-height: 0;
}

.scratch-column-inner .scratch-canvas-wrap {
  flex: 1 1 auto;
  min-height: 342px;
}

.scratch-inline-input {
  position: absolute;
  z-index: 2;
  transform: translate(-50%, -50%);
}

.scratch-inline-input input {
  font: inherit;
  font-size: 0.82rem;
  padding: 0.25rem 0.45rem;
  border: 1px solid var(--accent);
  border-radius: 8px;
  background: var(--panel);
  color: var(--text);
  min-width: 5rem;
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
}

  </style>
</head>
<body>
  <div id="app" class="app-root"></div>
  <script>
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();

(function () {
  const STORAGE_KEY = 'kg-course-scratch-v1';
  let scratchPersistOk = true;
  const pads = {};
  const history = {};
  let nextNodeId = 1;

  function emptyPad() {
    return { strokes: [], nodes: [], edges: [] };
  }

  function loadPads() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        const parsed = JSON.parse(raw);
        if (parsed && typeof parsed === 'object') {
          for (const [k, v] of Object.entries(parsed)) {
            if (v && typeof v === 'object') {
              pads[k] = {
                strokes: Array.isArray(v.strokes) ? v.strokes : [],
                nodes: Array.isArray(v.nodes) ? v.nodes : [],
                edges: Array.isArray(v.edges) ? v.edges : [],
              };
              history[k] = [];
              for (const n of pads[k].nodes) {
                const m = /^n(\d+)$/.exec(n.id);
                if (m) nextNodeId = Math.max(nextNodeId, parseInt(m[1], 10) + 1);
              }
            }
          }
        }
      }
    } catch (_) {
      scratchPersistOk = false;
    }
  }

  function savePads() {
    if (!scratchPersistOk) return false;
    try {
      const out = {};
      for (const [k, v] of Object.entries(pads)) {
        out[k] = { strokes: v.strokes, nodes: v.nodes, edges: v.edges };
      }
      localStorage.setItem(STORAGE_KEY, JSON.stringify(out));
      return true;
    } catch (_) {
      scratchPersistOk = false;
      return false;
    }
  }

  function padData(key) {
    if (!pads[key]) {
      pads[key] = emptyPad();
      history[key] = [];
    }
    if (!history[key]) history[key] = [];
    return pads[key];
  }

  function pushHistory(key, entry) {
    history[key].push(entry);
  }

  function readThemeColors() {
    const s = getComputedStyle(document.documentElement);
    return {
      ink: s.getPropertyValue('--text').trim(),
      accent: s.getPropertyValue('--accent').trim(),
      muted: s.getPropertyValue('--text-muted').trim(),
      bg: s.getPropertyValue('--bg').trim(),
      border: s.getPropertyValue('--border').trim(),
      panel: s.getPropertyValue('--panel').trim(),
    };
  }

  function colorForToken(colors, token) {
    if (token === 'accent') return colors.accent;
    if (token === 'muted') return colors.muted;
    return colors.ink;
  }

    const colors = readThemeColors();

      });

      b.type = 'button';
      b.className = 'scratch-tool-btn';
      b.textContent = label;
      b.setAttribute('data-tool', t);
      b.setAttribute('aria-pressed', t === tool ? 'true' : 'false');
      b.addEventListener('click', () => setTool(t));

      const hist = history[padKey];

        data.strokes.pop();
      } else if (last.type === 'node') {
        data.nodes = data.nodes.filter((n) => n.id !== last.id);
        data.edges = data.edges.filter(
          (e) => e.from !== last.id && e.to !== last.id
        );
      } else if (last.type === 'edge') {
        data.edges.pop();
      }
      savePads() || showPersistFail();
      redraw();
    });
    toolbar.appendChild(undoBtn);

    const clearBtn = document.createElement('button');
    clearBtn.type = 'button';
    clearBtn.className = 'scratch-tool-btn';
    clearBtn.textContent = 'Clear';
    clearBtn.addEventListener('click', () => {
      if (!confirm('Clear this scratchpad?')) return;
      data.strokes = [];
      data.nodes = [];
      data.edges = [];
      history[padKey] = [];
      savePads() || showPersistFail();
      redraw();
    });
    toolbar.appendChild(clearBtn);

    const swatchRow = document.createElement('div');
    swatchRow.className = 'scratch-swatches';
    for (const token of ['ink', 'accent', 'muted']) {
      const sw = document.createElement('button');
      sw.type = 'button';
      sw.className = 'scratch-swatch scratch-swatch-' + token;
      sw.title = token;
      sw.setAttribute('aria-pressed', token === colorToken ? 'true' : 'false');
      sw.addEventListener('click', () => {
        colorToken = token;
        swatchRow.querySelectorAll('.scratch-swatch').forEach((s) => {
          s.setAttribute(
            'aria-pressed',
            s.classList.contains('scratch-swatch-' + token) ? 'true' : 'false'
          );
        });
      });
      swatchRow.appendChild(sw);
    }
    toolbar.appendChild(swatchRow);

    const saveBtn = document.createElement('button');
    saveBtn.type = 'button';
    saveBtn.className = 'scratch-tool-btn';
    saveBtn.textContent = 'Save PNG';
    saveBtn.addEventListener('click', () => savePng(padKey));
    toolbar.appendChild(saveBtn);

    toolbar.appendChild(persistNote);

    const canvasWrap = document.createElement('div');
    canvasWrap.className = 'scratch-canvas-wrap';

    const canvas = document.createElement('canvas');
    canvas.className = 'scratch-canvas';
    canvasWrap.appendChild(canvas);

    wrap.appendChild(toolbar);
    wrap.appendChild(canvasWrap);
    container.appendChild(wrap);

    const ctx = canvas.getContext('2d');
    let cssW = 0;
    let cssH = 0;

    function canvasPoint(clientX, clientY) {
      const r = canvas.getBoundingClientRect();
      const x = (clientX - r.left) / r.width;
      const y = (clientY - r.top) / r.height;
      return {
        x: Math.max(0, Math.min(1, x)),
        y: Math.max(0, Math.min(1, y)),
      };
    }

    function px(nx, ny) {
      return { x: nx * cssW, y: ny * cssH };
    }

    function nodeAt(nx, ny) {
      const hit = 0.055;
      for (let i = data.nodes.length - 1; i >= 0; i--) {
        const n = data.nodes[i];
        const dx = nx - n.x;
        const dy = ny - n.y;
        if (dx * dx + dy * dy <= hit * hit) return n;
      }
      return null;
    }

    function measureNode(ctx2, label) {
      ctx2.font = '12px ' + getComputedStyle(document.documentElement).fontFamily;
      const tw = ctx2.measureText(label).width;
      const w = Math.max(tw + 16, 40);
      const h = 24;
      return { w, h };
    }

    function drawNode(ctx2, n, theme) {
      const p = px(n.x, n.y);
      const { w, h } = measureNode(ctx2, n.label || '');
      const x = p.x - w / 2;
      const y = p.y - h / 2;
      ctx2.fillStyle = theme.panel;
      ctx2.strokeStyle = theme.border;
      ctx2.lineWidth = 1;
      roundRect(ctx2, x, y, w, h, 6);
      ctx2.fill();
      ctx2.stroke();
      ctx2.fillStyle = theme.ink;
      ctx2.textAlign = 'center';
      ctx2.textBaseline = 'middle';
      ctx2.fillText(n.label || '', p.x, p.y);
    }

    function roundRect(ctx2, x, y, w, h, r) {
      ctx2.beginPath();
      ctx2.moveTo(x + r, y);
      ctx2.lineTo(x + w - r, y);
      ctx2.quadraticCurveTo(x + w, y, x + w, y + r);
      ctx2.lineTo(x + w, y + h - r);
      ctx2.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
      ctx2.lineTo(x + r, y + h);
      ctx2.quadraticCurveTo(x, y + h, x, y + h - r);
      ctx2.lineTo(x, y + r);
      ctx2.quadraticCurveTo(x, y, x + r, y);
      ctx2.closePath();
    }

    function drawEdge(ctx2, e, theme) {
      const from = data.nodes.find((n) => n.id === e.from);
      const to = data.nodes.find((n) => n.id === e.to);
      if (!from || !to) return;
      const a = px(from.x, from.y);
      const b = px(to.x, to.y);
      const dx = b.x - a.x;
      const dy = b.y - a.y;
      const len = Math.hypot(dx, dy) || 1;
      const ux = dx / len;
      const uy = dy / len;
      const shrink = 14;
      const x1 = a.x + ux * shrink;
      const y1 = a.y + uy * shrink;
      const x2 = b.x - ux * shrink;
      const y2 = b.y - uy * shrink;

      ctx2.strokeStyle = theme.ink;
      ctx2.fillStyle = theme.ink;
      ctx2.lineWidth = 1.5;
      ctx2.beginPath();
      ctx2.moveTo(x1, y1);
      ctx2.lineTo(x2, y2);
      ctx2.stroke();

      const ah = 8;
      const ax = x2 - ux * ah + (-uy) * (ah * 0.45);
      const ay = y2 - uy * ah + ux * (ah * 0.45);
      const bx = x2 - ux * ah - (-uy) * (ah * 0.45);
      const by = y2 - uy * ah - ux * (ah * 0.45);
      ctx2.beginPath();
      ctx2.moveTo(x2, y2);
      ctx2.lineTo(ax, ay);
      ctx2.lineTo(bx, by);
      ctx2.closePath();
      ctx2.fill();

      if (e.label) {
        const mx = (a.x + b.x) / 2;
        const my = (a.y + b.y) / 2;
        const off = 12;
        const lx = mx + (-uy) * off;
        const ly = my + ux * off;
        ctx2.font =
          '11px ' + getComputedStyle(document.documentElement).fontFamily;
        ctx2.textAlign = 'center';
        ctx2.textBaseline = 'middle';
        ctx2.fillStyle = theme.ink;
        ctx2.fillText(e.label, lx, ly);
      }
    }

    function drawStroke(ctx2, stroke, theme) {
      if (!stroke.pts || stroke.pts.length < 2) return;
      ctx2.strokeStyle = colorForToken(theme, stroke.c);
      ctx2.lineWidth = 2.5;
      ctx2.lineCap = 'round';
      ctx2.lineJoin = 'round';
      ctx2.beginPath();
      const first = px(stroke.pts[0][0], stroke.pts[0][1]);
      ctx2.moveTo(first.x, first.y);
      for (let i = 1; i < stroke.pts.length; i++) {
        const p = px(stroke.pts[i][0], stroke.pts[i][1]);
        ctx2.lineTo(p.x, p.y);
      }
      ctx2.stroke();
    }

    function redraw() {
      if (cssW <= 0 || cssH <= 0 || canvas.width <= 0 || canvas.height <= 0) {
        return;
      }
      const theme = readThemeColors();
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = theme.bg;
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      const scale = canvas.width / cssW;
      ctx.scale(scale, scale);
      for (const s of data.strokes) drawStroke(ctx, s, theme);
      for (const e of data.edges) drawEdge(ctx, e, theme);
      for (const n of data.nodes) drawNode(ctx, n, theme);
      if (currentStroke && currentStroke.pts.length) {
        drawStroke(ctx, currentStroke, theme);
      }
      if (edgeDrag) {
        const theme2 = readThemeColors();
        ctx.strokeStyle = theme2.muted;
        ctx.lineWidth = 1;
        ctx.setLineDash([4, 4]);
        const a = px(edgeDrag.from.x, edgeDrag.from.y);
        const b = px(edgeDrag.x, edgeDrag.y);
        ctx.beginPath();
        ctx.moveTo(a.x, a.y);
        ctx.lineTo(b.x, b.y);
        ctx.stroke();
        ctx.setLineDash([]);
      }
    }

    let resizeRaf = 0;

    function scheduleResize() {
      if (resizeRaf) return;
      resizeRaf = requestAnimationFrame(() => {
        resizeRaf = 0;
        resize();
      });
    }

    function resize() {
      const newW = canvasWrap.clientWidth;
      const newH = canvasWrap.clientHeight;
      if (newW <= 0 || newH <= 0) {
        scheduleResize();
        return;
      }
      const dpr = window.devicePixelRatio || 1;
      const newCw = Math.round(newW * dpr);
      const newCh = Math.round(newH * dpr);
      if (
        Math.abs(newW - cssW) < 0.5 &&
        Math.abs(newH - cssH) < 0.5 &&
        canvas.width === newCw &&
        canvas.height === newCh
      ) {
        return;
      }
      cssW = newW;
      cssH = newH;
      canvas.width = newCw;
      canvas.height = newCh;
      canvas.style.width = newW + 'px';
      canvas.style.height = newH + 'px';
      redraw();
    }

    function removeInlineInput() {
      if (inlineInput && inlineInput.parentNode) {
        inlineInput.parentNode.removeChild(inlineInput);
      }
      inlineInput = null;
    }

    function showInlineInput(clientX, clientY, initial, onCommit, onCancel) {
      removeInlineInput();
      const box = document.createElement('div');
      box.className = 'scratch-inline-input';
      const r = canvasWrap.getBoundingClientRect();
      box.style.left = clientX - r.left + 'px';
      box.style.top = clientY - r.top + 'px';
      const inp = document.createElement('input');
      inp.type = 'text';
      inp.value = initial || '';
      inp.setAttribute('aria-label', 'Label');
      box.appendChild(inp);
      canvasWrap.appendChild(box);
      inlineInput = box;
      inp.focus();
      function commit() {
        const v = inp.value.trim();
        removeInlineInput();
        if (v) onCommit(v);
        else if (onCancel) onCancel();
      }
      inp.addEventListener('keydown', (ev) => {
        if (ev.key === 'Enter') {
          ev.preventDefault();
          commit();
        } else if (ev.key === 'Escape') {
          ev.preventDefault();
          removeInlineInput();
          if (onCancel) onCancel();
        }
      });
      inp.addEventListener('blur', () => {
        setTimeout(() => {
          if (inlineInput === box) commit();
        }, 120);
      });
    }

    function persist() {
      if (!savePads()) showPersistFail();
    }

    canvas.addEventListener('pointerdown', (ev) => {
      if (inlineInput) return;
      const pt = canvasPoint(ev.clientX, ev.clientY);

      if (tool === 'pen') {
        canvas.setPointerCapture(ev.pointerId);
        drawing = true;
        currentStroke = { c: colorToken, pts: [[pt.x, pt.y]] };
        redraw();
      } else if (tool === 'node') {
        const hit = nodeAt(pt.x, pt.y);
        if (hit) {
          canvas.setPointerCapture(ev.pointerId);
          nodeDrag = { id: hit.id, startX: pt.x, startY: pt.y, moved: false };
        } else {
          const clickX = ev.clientX;
          const clickY = ev.clientY;
          const nx = pt.x;
          const ny = pt.y;
          setTimeout(() => {
            showInlineInput(
              clickX,
              clickY,
              '',
              (label) => {
                const id = 'n' + nextNodeId++;
                data.nodes.push({ id, x: nx, y: ny, label });
                pushHistory(padKey, { type: 'node', id });
                persist();
                redraw();
              },
              () => redraw()
            );
          }, 0);
        }
      } else if (tool === 'edge') {
        const hit = nodeAt(pt.x, pt.y);
        if (hit) {
          canvas.setPointerCapture(ev.pointerId);
          edgeDrag = { fromId: hit.id, from: hit, x: pt.x, y: pt.y };
        }
      }
    });

    canvas.addEventListener('pointermove', (ev) => {
      const pt = canvasPoint(ev.clientX, ev.clientY);
      if (tool === 'pen' && drawing && currentStroke) {
        const pts = currentStroke.pts;
        const last = pts[pts.length - 1];
        if (
          Math.hypot(pt.x - last[0], pt.y - last[1]) >
          0.002
        ) {
          pts.push([pt.x, pt.y]);
          redraw();
        }
      } else if (tool === 'node' && nodeDrag) {
        const n = data.nodes.find((x) => x.id === nodeDrag.id);
        if (n) {
          if (
            Math.hypot(pt.x - nodeDrag.startX, pt.y - nodeDrag.startY) > 0.01
          ) {
            nodeDrag.moved = true;
          }
          if (nodeDrag.moved) {
            n.x = pt.x;
            n.y = pt.y;
            redraw();
          }
        }
      } else if (tool === 'edge' && edgeDrag) {
        edgeDrag.x = pt.x;
        edgeDrag.y = pt.y;
        redraw();
      }
    });

    canvas.addEventListener('pointerup', (ev) => {
      try {
        canvas.releasePointerCapture(ev.pointerId);
      } catch (_) {}

      if (tool === 'pen' && drawing && currentStroke) {
        if (currentStroke.pts.length >= 2) {
          data.strokes.push(currentStroke);
          pushHistory(padKey, { type: 'stroke' });
          persist();
        }
        currentStroke = null;
        drawing = false;
        redraw();
      } else if (tool === 'node' && nodeDrag) {
        if (nodeDrag.moved) persist();
        nodeDrag = null;
      } else if (tool === 'edge' && edgeDrag) {
        const pt = canvasPoint(ev.clientX, ev.clientY);
        const target = nodeAt(pt.x, pt.y);
        const fromId = edgeDrag.fromId;
        if (target && target.id !== fromId) {
          const midX = (edgeDrag.from.x + target.x) / 2;
          const midY = (edgeDrag.from.y + target.y) / 2;
          const midClient = {
            x:
              canvas.getBoundingClientRect().left +
              midX * canvas.getBoundingClientRect().width,
            y:
              canvas.getBoundingClientRect().top +
              midY * canvas.getBoundingClientRect().height,
          };
          const pending = { from: fromId, to: target.id };
          const mcx = midClient.x;
          const mcy = midClient.y;
          edgeDrag = null;
          redraw();
          setTimeout(() => {
            showInlineInput(
              mcx,
              mcy,
              '',
              (label) => {
                data.edges.push({ from: pending.from, to: pending.to, label });
                pushHistory(padKey, { type: 'edge' });
                persist();
                redraw();
              },
              () => redraw()
            );
          }, 0);
        } else {
          edgeDrag = null;
          redraw();
        }
      }
    });

    canvas.addEventListener('pointercancel', () => {
      drawing = false;
      currentStroke = null;
      nodeDrag = null;
      edgeDrag = null;
      redraw();
    });

    const ro = new ResizeObserver(() => scheduleResize());
    ro.observe(canvasWrap);

    const themeObs = new MutationObserver(() => redraw());
    themeObs.observe(document.documentElement, {
      attributes: true,
      attributeFilter: ['data-theme'],
    });

    if (!scratchPersistOk) showPersistFail();

    resize();
    scheduleResize();

    return function destroy() {
      if (resizeRaf) {
        cancelAnimationFrame(resizeRaf);
        resizeRaf = 0;
      }
      ro.disconnect();
      themeObs.disconnect();
      removeInlineInput();
    };
  }

  function savePng(padKey) {
    const data = padData(padKey);
    const theme = readThemeColors();
    const w = 800;
    const h = 600;
    const scale = 2;
    const off = document.createElement('canvas');
    off.width = w * scale;
    off.height = h * scale;
    const ctx = off.getContext('2d');
    ctx.scale(scale, scale);
    ctx.fillStyle = theme.bg;
    ctx.fillRect(0, 0, w, h);

    function px2(nx, ny) {
      return { x: nx * w, y: ny * h };
    }

    function drawStroke2(stroke) {
      if (!stroke.pts || stroke.pts.length < 2) return;
      ctx.strokeStyle = colorForToken(theme, stroke.c);
      ctx.lineWidth = 2.5;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.beginPath();
      const first = px2(stroke.pts[0][0], stroke.pts[0][1]);
      ctx.moveTo(first.x, first.y);
      for (let i = 1; i < stroke.pts.length; i++) {
        const p = px2(stroke.pts[i][0], stroke.pts[i][1]);
        ctx.lineTo(p.x, p.y);
      }
      ctx.stroke();
    }

    function drawNode2(n) {
      const p = px2(n.x, n.y);
      ctx.font = '12px ' + getComputedStyle(document.documentElement).fontFamily;
      const tw = ctx.measureText(n.label || '').width;
      const bw = Math.max(tw + 16, 40);
      const bh = 24;
      const x = p.x - bw / 2;
      const y = p.y - bh / 2;
      ctx.fillStyle = theme.panel;
      ctx.strokeStyle = theme.border;
      ctx.lineWidth = 1;
      roundRect(ctx, x, y, bw, bh, 6);
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = theme.ink;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(n.label || '', p.x, p.y);
    }

    function roundRect(ctx2, x, y, bw, bh, r) {
      ctx2.beginPath();
      ctx2.moveTo(x + r, y);
      ctx2.lineTo(x + bw - r, y);
      ctx2.quadraticCurveTo(x + bw, y, x + bw, y + r);
      ctx2.lineTo(x + bw, y + bh - r);
      ctx2.quadraticCurveTo(x + bw, y + bh, x + bw - r, y + bh);
      ctx2.lineTo(x + r, y + bh);
      ctx2.quadraticCurveTo(x, y + bh, x, y + bh - r);
      ctx2.lineTo(x, y + r);
      ctx2.quadraticCurveTo(x, y, x + r, y);
      ctx2.closePath();
    }

    function drawEdge2(e) {
      const from = data.nodes.find((n) => n.id === e.from);
      const to = data.nodes.find((n) => n.id === e.to);
      if (!from || !to) return;
      const a = px2(from.x, from.y);
      const b = px2(to.x, to.y);
      const dx = b.x - a.x;
      const dy = b.y - a.y;
      const len = Math.hypot(dx, dy) || 1;
      const ux = dx / len;
      const uy = dy / len;
      const shrink = 14;
      const x1 = a.x + ux * shrink;
      const y1 = a.y + uy * shrink;
      const x2 = b.x - ux * shrink;
      const y2 = b.y - uy * shrink;
      ctx.strokeStyle = theme.ink;
      ctx.fillStyle = theme.ink;
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.lineTo(x2, y2);
      ctx.stroke();
      const ah = 8;
      ctx.beginPath();
      ctx.moveTo(x2, y2);
      ctx.lineTo(x2 - ux * ah + (-uy) * (ah * 0.45), y2 - uy * ah + ux * (ah * 0.45));
      ctx.lineTo(x2 - ux * ah - (-uy) * (ah * 0.45), y2 - uy * ah - ux * (ah * 0.45));
      ctx.closePath();
      ctx.fill();
      if (e.label) {
        const mx = (a.x + b.x) / 2;
        const my = (a.y + b.y) / 2;
        const offN = 12;
        ctx.font = '11px ' + getComputedStyle(document.documentElement).fontFamily;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillStyle = theme.ink;
        ctx.fillText(e.label, mx + (-uy) * offN, my + ux * offN);
      }
    }

    for (const s of data.strokes) drawStroke2(s);
    for (const e of data.edges) drawEdge2(e);
    for (const n of data.nodes) drawNode2(n);

    off.toBlob((blob) => {
      if (!blob) return;
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'kg-scratch-' + padKey + '.png';
      a.click();
      URL.revokeObjectURL(a.href);
    }, 'image/png');
  }

  loadPads();

  window.KGScratchpad = {
    mount,
    savePng,
    scratchPersistOk: () => scratchPersistOk,
  };
})();

(function () {
  const grader = window.KGGrader;
  const STORAGE_KEY = 'kg-course-v1';

  let persistOk = true;
  let state = defaultState();
  const cardState = {};
  let view = { kind: 'overview' };
  let drill = null;
  let focusExerciseId = null;
  let scratchUnmount = null;

  function scratchPadKey() {
    if (view.kind === 'module') return view.id;
    return 'overview';
  }

  function scratchVisibleForView() {
    return (
      state.scratchOpen &&
      (view.kind === 'overview' || view.kind === 'module')
    );
  }

  function buildScratchBlock(container) {
    const block = el('div', { className: 'scratch-block' });
    block.appendChild(el('h2', { className: 'scratch-heading', text: 'Scratchpad' }));
    const mountPt = el('div', { className: 'scratch-mount' });
    block.appendChild(mountPt);
    container.appendChild(block);
    return mountPt;
  }

  function buildScratchColumn(shell) {
    const aside = el('aside', {
      className: 'scratch-column',
      'aria-label': 'Scratchpad',
    });
    const inner = el('div', { className: 'scratch-column-inner' });
    inner.appendChild(el('h2', { className: 'scratch-heading', text: 'Scratchpad' }));
    const mountPt = el('div', { className: 'scratch-mount' });
    inner.appendChild(mountPt);
    aside.appendChild(inner);
    shell.appendChild(aside);
    return mountPt;
  }

  function attachScratchMount(mountPt, padKey) {
    if (scratchUnmount) scratchUnmount();
    scratchUnmount = window.KGScratchpad.mount(mountPt, padKey);
  }

  function defaultState() {
    return { v: 1, rec: {}, log: [], theme: 'dark', scratchOpen: false };
  }

  function loadState() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        const parsed = JSON.parse(raw);
        if (parsed && parsed.v === 1) {
          state = {
            v: 1,
            rec: parsed.rec || {},
            log: Array.isArray(parsed.log) ? parsed.log : [],
            theme: parsed.theme === 'light' ? 'light' : 'dark',
            scratchOpen: !!parsed.scratchOpen,
          };
        }
      }
    } catch (_) {
      persistOk = false;
    }
    document.documentElement.setAttribute('data-theme', state.theme);
  }

  function saveState() {
    if (!persistOk) return;
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    } catch (_) {
      persistOk = false;
      render();
    }
  }

  function allExercises() {
    return COURSE.modules.flatMap((m) =>
      m.exercises.map((e) => ({ module: m, exercise: e }))
    );
  }

  function modulesInPhase(phaseId) {
    return COURSE.modules.filter((m) => m.phase === phaseId);
  }

  function phaseForModule(mod) {
    return COURSE.phases.find((p) => p.id === mod.phase);
  }

  function findExercise(id) {
    for (const m of COURSE.modules) {
      const ex = m.exercises.find((e) => e.id === id);
      if (ex) return { module: m, exercise: ex };
    }
    return null;
  }

  function recFor(id) {
    return state.rec[id] || { best: 0, attempts: 0, last: 0 };
  }

  function moduleMastery(mod) {
    const scores = mod.exercises.map((e) => recFor(e.id).best);
    if (!scores.length) return 0;
    const mean = scores.reduce((a, b) => a + b, 0) / scores.length;
    return mean;
  }

  function meterOnCount(mean) {
    return Math.round(mean * 8);
  }

  function overallMastery() {
    const all = allExercises();
    if (!all.length) return 0;
    const sum = all.reduce((s, { exercise }) => s + recFor(exercise.id).best, 0);
    return sum / all.length;
  }

  function stats() {
    const all = allExercises();
    const total = all.length;
    let solved = 0;
    let attempted = 0;
    let weakest = null;
    let weakestVal = 2;
    for (const m of COURSE.modules) {
      const mm = moduleMastery(m);
      if (mm < weakestVal) {
        weakestVal = mm;
        weakest = m;
      }
      for (const e of m.exercises) {
        const r = recFor(e.id);
        if (r.best >= 1) solved++;
        if (r.attempts > 0) attempted++;
      }
    }
    return {
      total,
      solved,
      attempted,
      meanPct: Math.round(overallMastery() * 100),
      weakest,
    };
  }

  function reviewList() {
    return allExercises().filter(({ exercise }) => recFor(exercise.id).best < 1);
  }

  function defaultDraft(ex) {
    switch (ex.type) {
      case 'mcq':
        return null;
      case 'multi':
        return [];
      case 'triples':
        return '';
      case 'categorize':
        return {};
      case 'order':
        return [];
      case 'cloze':
        return ex.blanks.map(() => '');
      case 'numeric':
        return '';
      default:
        return null;
    }
  }

  function getCard(id, ex) {
    if (!cardState[id]) {
      cardState[id] = {
        draft: defaultDraft(ex),
        result: null,
        locked: false,
        showAnswer: false,
      };
    }
    return cardState[id];
  }

  function recordGrade(exercise, answer, result) {
    const id = exercise.id;
    const prev = recFor(id);
    const best = Math.max(prev.best, result.score);
    state.rec[id] = {
      best,
      attempts: prev.attempts + 1,
      last: Date.now(),
    };
    if (result.score < 1) {
      state.log.push({
        id,
        score: result.score,
        given: answer,
        at: Date.now(),
      });
      if (state.log.length > 200) {
        state.log = state.log.slice(-200);
      }
    }
    saveState();
  }

  function verdictLabel(v) {
    if (v === 'correct') return 'Correct';
    if (v === 'partial') return 'Partly right';
    return 'Not right yet';
  }

  function escapeHtml(s) {
    return String(s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function el(tag, attrs, children) {
    const node = document.createElement(tag);
    if (attrs) {
      for (const [k, v] of Object.entries(attrs)) {
        if (k === 'className') node.className = v;
        else if (k === 'text') node.textContent = v;
        else if (k.startsWith('on') && typeof v === 'function') {
          node.addEventListener(k.slice(2).toLowerCase(), v);
        } else if (v != null) node.setAttribute(k, v);
      }
    }
    if (children != null) {
      const list = Array.isArray(children) ? children : [children];
      for (const c of list) {
        if (c == null) continue;
        if (typeof c === 'string') node.appendChild(document.createTextNode(c));
        else node.appendChild(c);
      }
    }
    return node;
  }

  function renderFeedback(container, result, exercise, card) {
    const panel = el('div', { className: 'feedback', role: 'status' });
    const bar = el('div', {
      className: 'verdict-bar ' + result.verdict,
      text:
        verdictLabel(result.verdict) +
        ' (' +
        Math.round(result.score * 100) +
        '%)',
    });
    panel.appendChild(bar);
    panel.appendChild(el('p', { text: result.why }));
    for (const line of result.lines) {
      panel.appendChild(el('p', { className: 'feedback-line', text: line }));
    }
    if (result.score < 1) {
      const tryBtn = el('button', {
        type: 'button',
        className: 'btn-secondary',
        text: 'Try again',
      });
      tryBtn.addEventListener('click', () => {
        card.result = null;
        card.locked = false;
        card.showAnswer = false;
        if (exercise.type !== 'mcq') card.draft = defaultDraft(exercise);
        render();
      });
      panel.appendChild(tryBtn);
    }
    if (
      (exercise.type === 'triples' || exercise.type === 'cloze') &&
      !card.showAnswer
    ) {
      const showBtn = el('button', {
        type: 'button',
        className: 'btn-secondary',
        text: 'Show answer',
      });
      showBtn.addEventListener('click', () => {
        card.showAnswer = true;
        render();
      });
      panel.appendChild(showBtn);
    }
    if (card.showAnswer) {
      const ans = el('div', { className: 'hint-line' });
      if (exercise.type === 'triples') {
        const lines = exercise.expected.map(
          (t) => t.s[0] + ' | ' + t.p[0] + ' | ' + t.o[0]
        );
        ans.textContent = lines.join('\n');
      } else if (exercise.type === 'cloze') {
        ans.textContent = exercise.blanks
          .map((b) => b.accept[0])
          .join(', ');
      }
      panel.appendChild(ans);
    }
    container.appendChild(panel);
  }

  function gradeCard(exercise, card) {
    const result = grader.grade(exercise, card.draft);
    card.result = result;
    recordGrade(exercise, card.draft, result);
    render();
  }

  function renderExerciseControls(exercise, card, wrap) {
    const t = exercise.type;
    if (t === 'mcq') {
      exercise.options.forEach((opt, i) => {
        const btn = el('button', {
          type: 'button',
          className:
            'option-row' +
            (card.draft === i ? ' selected' : ''),
          disabled: card.locked ? 'true' : null,
        });
        btn.textContent = opt;
        btn.addEventListener('click', () => {
          if (card.locked) return;
          card.draft = i;
          card.locked = true;
          gradeCard(exercise, card);
        });
        wrap.appendChild(btn);
      });
    } else if (t === 'multi') {
      exercise.options.forEach((opt, i) => {
        const row = el('label', { className: 'check-row' });
        const cb = document.createElement('input');
        cb.type = 'checkbox';
        cb.checked = card.draft.includes(i);
        cb.addEventListener('change', () => {
          if (cb.checked) {
            if (!card.draft.includes(i)) card.draft.push(i);
          } else {
            card.draft = card.draft.filter((x) => x !== i);
          }
        });
        row.appendChild(cb);
        row.appendChild(document.createTextNode(opt));
        wrap.appendChild(row);
      });
      const chk = el('button', {
        type: 'button',
        className: 'btn-check',
        text: 'Check',
      });
      chk.addEventListener('click', () => gradeCard(exercise, card));
      wrap.appendChild(chk);
    } else if (t === 'triples') {
      const ta = el('textarea', {
        className: 'triples-area',
        rows: '6',
        placeholder: exercise.format,
      });
      ta.value = card.draft;
      ta.addEventListener('input', () => {
        card.draft = ta.value;
      });
      wrap.appendChild(ta);
      wrap.appendChild(
        el('div', {
          className: 'hint-line',
          text: 'Example: ' + exercise.example,
        })
      );
      if (exercise.hint) {
        wrap.appendChild(el('div', { className: 'hint-line', text: exercise.hint }));
      }
      wrap.appendChild(
        el('button', {
          type: 'button',
          className: 'btn-check',
          text: 'Check',
          onClick: () => gradeCard(exercise, card),
        })
      );
    } else if (t === 'categorize') {
      exercise.items.forEach((item, i) => {
        const row = el('div', { className: 'categorize-item' });
        row.appendChild(el('span', { text: item.text }));
        exercise.buckets.forEach((b, bi) => {
          const bb = el('button', {
            type: 'button',
            className:
              'bucket-btn' + (card.draft[i] === bi ? ' active' : ''),
            text: b,
          });
          bb.addEventListener('click', () => {
            card.draft[i] = bi;
            render();
          });
          row.appendChild(bb);
        });
        wrap.appendChild(row);
      });
      wrap.appendChild(
        el('button', {
          type: 'button',
          className: 'btn-check',
          text: 'Check',
          onClick: () => gradeCard(exercise, card),
        })
      );
    } else if (t === 'order') {
      const ow = el('div', { className: 'order-wrap' });
      const pool = el('div', { className: 'order-pool' });
      const seq = el('div', { className: 'order-seq' });
      const inSeq = new Set(card.draft);
      exercise.items.forEach((text, i) => {
        if (!inSeq.has(i)) {
          const b = el('button', {
            type: 'button',
            className: 'order-step',
            text: text,
          });
          b.addEventListener('click', () => {
            card.draft.push(i);
            render();
          });
          pool.appendChild(b);
        }
      });
      card.draft.forEach((idx, pos) => {
        const b = el('button', {
          type: 'button',
          className: 'order-step',
          'data-pos': String(pos + 1),
          text: exercise.items[idx],
        });
        b.addEventListener('click', () => {
          card.draft = card.draft.filter((x) => x !== idx);
          render();
        });
        seq.appendChild(b);
      });
      ow.appendChild(el('div', { text: 'Available steps' }));
      ow.appendChild(pool);
      ow.appendChild(el('div', { text: 'Your sequence' }));
      ow.appendChild(seq);
      wrap.appendChild(ow);
      wrap.appendChild(
        el('button', {
          type: 'button',
          className: 'btn-check',
          text: 'Check',
          onClick: () => gradeCard(exercise, card),
        })
      );
    } else if (t === 'cloze') {
      const parts = exercise.sentence.split('______');
      const line = el('p', { className: 'cloze-sentence' });
      line.appendChild(document.createTextNode(parts[0] || ''));
      const inp = el('input', {
        className: 'cloze-input',
        type: 'text',
        value: card.draft[0] || '',
      });
      inp.addEventListener('input', () => {
        card.draft[0] = inp.value;
      });
      line.appendChild(inp);
      line.appendChild(document.createTextNode(parts[1] || ''));
      wrap.appendChild(line);
      wrap.appendChild(
        el('button', {
          type: 'button',
          className: 'btn-check',
          text: 'Check',
          onClick: () => gradeCard(exercise, card),
        })
      );
    } else if (t === 'numeric') {
      const inp = el('input', {
        className: 'num-input',
        type: 'text',
        inputmode: 'decimal',
        value: card.draft,
      });
      inp.addEventListener('input', () => {
        card.draft = inp.value;
      });
      wrap.appendChild(inp);
      if (exercise.hint) {
        wrap.appendChild(el('div', { className: 'hint-line', text: exercise.hint }));
      }
      wrap.appendChild(
        el('button', {
          type: 'button',
          className: 'btn-check',
          text: 'Check',
          onClick: () => gradeCard(exercise, card),
        })
      );
    }
    if (card.result) renderFeedback(wrap, card.result, exercise, card);
  }

  function renderLesson(lesson, container) {
    const box = el('div', { className: 'lesson' });
    for (const block of lesson) {
      if (block.t === 'p') {
        box.appendChild(el('p', { text: block.x }));
      } else if (block.t === 'h') {
        box.appendChild(el('h2', { text: block.x }));
      } else if (block.t === 'ul') {
        const ul = el('ul');
        for (const li of block.x) ul.appendChild(el('li', { text: li }));
        box.appendChild(ul);
      } else if (block.t === 'code') {
        const wrap = el('div', { className: 'code-block-wrap' });
        const pre = el('pre', { text: block.x });
        const copy = el('button', {
          type: 'button',
          className: 'btn-copy',
          text: 'Copy',
        });
        copy.addEventListener('click', () => {
          navigator.clipboard.writeText(block.x).catch(() => {});
        });
        wrap.appendChild(pre);
        wrap.appendChild(copy);
        box.appendChild(wrap);
      } else if (block.t === 'note') {
        box.appendChild(el('div', { className: 'note-callout', text: block.x }));
      }
    }
    container.appendChild(box);
  }

  function renderInstructions(instructions, container) {
    const panel = el('div', { className: 'instructions-panel' });
    panel.appendChild(el('h2', { text: 'Instructions' }));
    const ol = el('ol');
    for (const line of instructions) {
      ol.appendChild(el('li', { text: line }));
    }
    panel.appendChild(ol);
    container.appendChild(panel);
  }

  function renderModule(mod, container) {
    container.appendChild(el('p', { className: 'kicker', text: mod.kicker }));
    container.appendChild(el('h1', { text: mod.title }));
    container.appendChild(el('p', { className: 'goal', text: mod.goal }));
    const ph = phaseForModule(mod);
    if (ph) {
      container.appendChild(
        el('p', {
          className: 'module-meta',
          text: ph.label + ' · ' + mod.weeks,
        })
      );
    }
    renderLesson(mod.lesson, container);
    if (mod.text) {
      const st = el('div', { className: 'sample-text' });
      st.appendChild(el('h3', { text: 'Sample text' }));
      st.appendChild(el('pre', { text: mod.text.body }));
      container.appendChild(st);
    }
    if (mod.instructions && mod.instructions.length) {
      renderInstructions(mod.instructions, container);
    }
    const n = mod.exercises.length;
    mod.exercises.forEach((exercise, idx) => {
      const card = getCard(exercise.id, exercise);
      const cardEl = el('article', {
        className:
          'exercise-card' +
          (focusExerciseId === exercise.id ? ' flash-outline' : ''),
        id: 'ex-' + exercise.id,
      });
      cardEl.appendChild(
        el('div', {
          className: 'exercise-meta',
          text: 'Item ' + (idx + 1) + ' of ' + n,
        })
      );
      if (exercise.type !== 'cloze') {
        cardEl.appendChild(
          el('div', { className: 'exercise-prompt', text: exercise.prompt })
        );
      }
      const controls = el('div', { className: 'exercise-controls' });
      renderExerciseControls(exercise, card, controls);
      cardEl.appendChild(controls);
      container.appendChild(cardEl);
    });
    const mm = Math.round(moduleMastery(mod) * 100);
    const strip = el('div', { className: 'completion-strip' });
    strip.appendChild(
      el('span', { text: 'Part mastery: ' + mm + '%' })
    );
    const next = COURSE.modules.find((m) => m.num === mod.num + 1);
    if (next) {
      strip.appendChild(
        el('button', {
          type: 'button',
          className: 'btn-check',
          text: 'Next part',
          onClick: () => {
            view = { kind: 'module', id: next.id };
            render();
          },
        })
      );
    }
    container.appendChild(strip);
  }

  function renderOverview(container) {
    container.appendChild(el('h1', { text: COURSE.course.title }));
    container.appendChild(
      el('p', { className: 'goal', text: COURSE.course.subtitle })
    );
    container.appendChild(el('h2', { text: 'How this works' }));
    const ul = el('ul');
    for (const h of COURSE.course.howto) {
      ul.appendChild(el('li', { text: h }));
    }
    container.appendChild(ul);
    const st = stats();
    const row = el('div', { className: 'stats-row' });
    const mkStat = (label, value) => {
      const s = el('span');
      s.appendChild(document.createTextNode(label + ' '));
      const strong = el('strong', { text: value });
      s.appendChild(strong);
      return s;
    };
    row.appendChild(
      mkStat('Items solved:', st.solved + '/' + st.total)
    );
    row.appendChild(mkStat('Mean mastery:', st.meanPct + '%'));
    row.appendChild(mkStat('Items attempted:', String(st.attempted)));
    if (st.weakest) {
      row.appendChild(mkStat('Weakest part:', 'Part ' + st.weakest.num));
    }
    container.appendChild(row);
    if (COURSE.course.source) {
      container.appendChild(
        el('p', {
          className: 'course-source',
          text: 'Source: ' + COURSE.course.source,
        })
      );
    }
    for (const phase of COURSE.phases) {
      const mods = modulesInPhase(phase.id);
      if (!mods.length) continue;
      const heading = el('div', { className: 'phase-heading' });
      heading.appendChild(el('h2', { text: phase.label }));
      if (phase.note) {
        heading.appendChild(el('p', { text: phase.note }));
      }
      container.appendChild(heading);
      const grid = el('div', { className: 'module-grid' });
      for (const m of mods) {
        const mm = Math.round(moduleMastery(m) * 100);
        const anyAttempt = m.exercises.some((e) => recFor(e.id).attempts > 0);
        const card = el('div', { className: 'module-card' });
        card.appendChild(
          el('div', {
            className: 'rail-num',
            text: String(m.num).padStart(2, '0'),
          })
        );
        card.appendChild(el('strong', { text: m.title }));
        card.appendChild(el('span', { text: m.kicker }));
        card.appendChild(el('p', { text: m.goal }));
        card.appendChild(
          el('span', {
            text: anyAttempt ? 'Mastery ' + mm + '%' : 'Not started',
          })
        );
        card.appendChild(
          el('button', {
            type: 'button',
            className: 'btn-check btn-open',
            text: 'Open',
            onClick: () => {
              view = { kind: 'module', id: m.id };
              render();
            },
          })
        );
        grid.appendChild(card);
      }
      container.appendChild(grid);
    }
  }

  function renderReview(container) {
    const weak = reviewList();
    if (!weak.length) {
      container.appendChild(
        el('div', {
          className: 'empty-state',
          text: 'Nothing below a perfect score. Your review list is empty.',
        })
      );
      return;
    }
    container.appendChild(el('h1', { text: 'Review' }));
    container.appendChild(
      el('button', {
        type: 'button',
        className: 'btn-check',
        text: 'Start drill',
        onClick: () => {
          const items = weak.slice(0, 10).map((w) => w.exercise.id);
          drill = { ids: items, index: 0, done: false };
          view = { kind: 'drill' };
          render();
        },
      })
    );
    const byMod = {};
    for (const { module, exercise } of weak) {
      if (!byMod[module.id]) byMod[module.id] = { module, items: [] };
      byMod[module.id].items.push(exercise);
    }
    for (const m of COURSE.modules) {
      const g = byMod[m.id];
      if (!g) continue;
      const grp = el('div', { className: 'review-group' });
      grp.appendChild(
        el('h3', {
          text: 'Part ' + String(m.num).padStart(2, '0') + ': ' + m.title,
        })
      );
      for (const exercise of g.items) {
        const row = el('div', { className: 'review-row' });
        const prompt =
          exercise.prompt.length > 90
            ? exercise.prompt.slice(0, 87) + '...'
            : exercise.prompt;
        row.appendChild(el('span', { text: prompt }));
        row.appendChild(
          el('span', {
            text: Math.round(recFor(exercise.id).best * 100) + '%',
          })
        );
        row.appendChild(
          el('button', {
            type: 'button',
            className: 'btn-secondary',
            text: 'Practise',
            onClick: () => {
              view = { kind: 'module', id: m.id };
              focusExerciseId = exercise.id;
              render();
              requestAnimationFrame(() => {
                const elx = document.getElementById('ex-' + exercise.id);
                if (elx) elx.scrollIntoView({ behavior: 'smooth', block: 'center' });
                setTimeout(() => {
                  focusExerciseId = null;
                }, 1500);
              });
            },
          })
        );
        grp.appendChild(row);
      }
      container.appendChild(grp);
    }
  }

  function advanceDrill(result) {
    if (!drill) return;
    if (!drill.summary) drill.summary = [];
    drill.summary.push(result.score);
    if (drill.index + 1 >= drill.ids.length) drill.done = true;
    else drill.index++;
    render();
  }

  function renderDrill(container) {
    if (!drill || drill.done) {
      container.appendChild(el('h1', { text: 'Drill complete' }));
      const scores = (drill && drill.summary) || [];
      const avg =
        scores.length
          ? Math.round(
              (scores.reduce((a, b) => a + b, 0) / scores.length) * 100
            )
          : 0;
      container.appendChild(
        el('p', { text: 'Average score this drill: ' + avg + '%' })
      );
      container.appendChild(
        el('button', {
          type: 'button',
          className: 'btn-check',
          text: 'Back to review',
          onClick: () => {
            drill = null;
            view = { kind: 'review' };
            render();
          },
        })
      );
      return;
    }
    const id = drill.ids[drill.index];
    const found = findExercise(id);
    if (!found) {
      drill.done = true;
      render();
      return;
    }
    container.appendChild(
      el('div', {
        className: 'drill-progress',
        text:
          'Drill ' +
          (drill.index + 1) +
          ' of ' +
          drill.ids.length,
      })
    );
    const card = getCard(found.exercise.id, found.exercise);
    card.result = null;
    card.locked = false;
    const wrap = el('article', { className: 'exercise-card' });
    wrap.appendChild(
      el('div', { className: 'exercise-prompt', text: found.exercise.prompt })
    );
    const controls = el('div');
    const ex = found.exercise;
    const t = ex.type;
    if (t === 'mcq') {
      ex.options.forEach((opt, i) => {
        const btn = el('button', { type: 'button', className: 'option-row' });
        btn.textContent = opt;
        btn.addEventListener('click', () => {
          const result = grader.grade(ex, i);
          recordGrade(ex, i, result);
          advanceDrill(result);
        });
        controls.appendChild(btn);
      });
    } else {
      renderExerciseControls(ex, card, controls);
      const chk = controls.querySelector('.btn-check');
      if (chk) {
        chk.addEventListener('click', (ev) => {
          ev.stopPropagation();
          const result = grader.grade(ex, card.draft);
          recordGrade(ex, card.draft, result);
          advanceDrill(result);
        });
      }
    }
    wrap.appendChild(controls);
    container.appendChild(wrap);
  }

  function renderErrorLog(container) {
    container.appendChild(el('h1', { text: 'Error log' }));
    if (!state.log.length) {
      container.appendChild(
        el('div', {
          className: 'empty-state',
          text: 'No misses logged yet.',
        })
      );
      return;
    }
    const table = el('table', { className: 'log-table' });
    const head = el('tr');
    for (const h of ['Time', 'Part', 'Item', 'Score', 'Given', 'Why']) {
      head.appendChild(el('th', { text: h }));
    }
    table.appendChild(el('thead', null, head));
    const tbody = el('tbody');
    const logs = state.log.slice().reverse();
    for (const entry of logs) {
      const found = findExercise(entry.id);
      const modNum = found ? found.module.num : '?';
      let givenStr = '';
      try {
        givenStr = JSON.stringify(entry.given);
      } catch (_) {
        givenStr = String(entry.given);
      }
      if (givenStr.length > 120) givenStr = givenStr.slice(0, 117) + '...';
      const why = found ? found.exercise.why : '';
      const tr = el('tr');
      tr.appendChild(
        el('td', {
          text: new Date(entry.at).toLocaleString(),
        })
      );
      tr.appendChild(el('td', { text: String(modNum) }));
      tr.appendChild(el('td', { text: entry.id }));
      tr.appendChild(
        el('td', { text: Math.round(entry.score * 100) + '%' })
      );
      tr.appendChild(el('td', { text: givenStr }));
      tr.appendChild(el('td', { text: why }));
      tbody.appendChild(tr);
    }
    table.appendChild(tbody);
    container.appendChild(table);
  }

  function railMeter(mean) {
    const on = meterOnCount(mean);
    const segs = [];
    for (let i = 0; i < 8; i++) {
      segs.push(el('div', { className: 'meter-seg' + (i < on ? ' on' : '') }));
    }
    return el('div', { className: 'meter' }, segs);
  }

  function renderRail(root) {
    const rail = el('aside', { className: 'rail' });
    const nav = el('nav', { className: 'rail-nav', 'aria-label': 'Course' });

    const ov = el('button', {
      type: 'button',
      className: 'rail-item',
      'aria-current': view.kind === 'overview' ? 'page' : null,
    });
    ov.appendChild(el('span', { className: 'rail-item-label', text: 'Overview' }));
    ov.addEventListener('click', () => {
      view = { kind: 'overview' };
      drill = null;
      render();
    });
    nav.appendChild(ov);

    for (const phase of COURSE.phases) {
      const mods = modulesInPhase(phase.id);
      if (!mods.length) continue;
      const header = el('div', { className: 'rail-phase-header' });
      header.appendChild(el('span', { className: 'rail-phase-label', text: phase.label }));
      if (phase.note) {
        header.appendChild(el('span', { className: 'rail-phase-note', text: phase.note }));
      }
      nav.appendChild(header);
      for (const m of mods) {
        const mm = moduleMastery(m);
        const btn = el('button', {
          type: 'button',
          className: 'rail-item',
          'aria-current':
            view.kind === 'module' && view.id === m.id ? 'page' : null,
        });
        const label = el('span', { className: 'rail-item-label' });
        label.appendChild(
          el('span', {
            className: 'rail-num',
            text: String(m.num).padStart(2, '0'),
          })
        );
        label.appendChild(document.createTextNode(m.title));
        btn.appendChild(label);
        btn.appendChild(railMeter(mm));
        btn.addEventListener('click', () => {
          view = { kind: 'module', id: m.id };
          drill = null;
          render();
        });
        nav.appendChild(btn);
      }
    }

    const weakN = reviewList().length;
    const rev = el('button', {
      type: 'button',
      className: 'rail-item',
      'aria-current': view.kind === 'review' || view.kind === 'drill' ? 'page' : null,
    });
    rev.appendChild(
      el('span', {
        className: 'rail-item-label',
        text: 'Review (' + weakN + ')',
      })
    );
    rev.addEventListener('click', () => {
      view = { kind: 'review' };
      drill = null;
      render();
    });
    nav.appendChild(rev);

    const logN = state.log.length;
    const logBtn = el('button', {
      type: 'button',
      className: 'rail-item',
      'aria-current': view.kind === 'log' ? 'page' : null,
    });
    logBtn.appendChild(
      el('span', {
        className: 'rail-item-label',
        text: 'Error log (' + logN + ')',
      })
    );
    logBtn.addEventListener('click', () => {
      view = { kind: 'log' };
      drill = null;
      render();
    });
    nav.appendChild(logBtn);

    rail.appendChild(nav);

    const foot = el('div', { className: 'rail-footer' });
    foot.appendChild(
      el('button', {
        type: 'button',
        text: 'Export',
        onClick: () => {
          const blob = new Blob([JSON.stringify(state, null, 2)], {
            type: 'application/json',
          });
          const a = document.createElement('a');
          a.href = URL.createObjectURL(blob);
          a.download = 'kg-course-progress.json';
          a.click();
          URL.revokeObjectURL(a.href);
        },
      })
    );
    const importLabel = el('label', { text: 'Import' });
    const importInput = el('input', {
      type: 'file',
      accept: 'application/json,.json',
      className: 'hidden-input',
    });
    importInput.addEventListener('change', () => {
      const file = importInput.files && importInput.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const parsed = JSON.parse(reader.result);
          if (!confirm('Replace all progress with the imported file?')) return;
          state = {
            v: 1,
            rec: parsed.rec || {},
            log: parsed.log || [],
            theme: parsed.theme === 'light' ? 'light' : 'dark',
            scratchOpen: !!parsed.scratchOpen,
          };
          document.documentElement.setAttribute('data-theme', state.theme);
          saveState();
          render();
        } catch (_) {
          alert('Could not read that file.');
        }
      };
      reader.readAsText(file);
    });
    importLabel.appendChild(importInput);
    foot.appendChild(importLabel);
    foot.appendChild(
      el('button', {
        type: 'button',
        text: 'Reset',
        onClick: () => {
          if (!confirm('Clear all progress on this machine?')) return;
          state = defaultState();
          document.documentElement.setAttribute('data-theme', state.theme);
          saveState();
          render();
        },
      })
    );
    rail.appendChild(foot);

    if (!persistOk) {
      rail.appendChild(
        el('p', {
          className: 'rail-persist-note',
          text: 'Progress will not persist here',
        })
      );
    }

    root.appendChild(rail);
  }

  function render() {
    if (scratchUnmount) {
      scratchUnmount();
      scratchUnmount = null;
    }

    const root = document.getElementById('app');
    root.innerHTML = '';
    const wideScratch =
      window.matchMedia('(min-width: 1200px)').matches;
    const showScratch = scratchVisibleForView();
    const padKey = scratchPadKey();
    root.className = 'app-root';
    if (showScratch && wideScratch) {
      root.classList.add('scratch-wide');
    }

    const header = el('header', { className: 'app-header' });
    header.appendChild(el('span', { className: 'brand', text: 'KG Course' }));
    header.appendChild(
      el('span', {
        className: 'header-title',
        text: COURSE.course.title,
      })
    );
    const om = Math.round(overallMastery() * 100);
    header.appendChild(
      el('span', {
        className: 'header-mastery',
        text: 'Mastery ' + om + '%',
      })
    );
    const themeBtn = el('button', {
      type: 'button',
      className: 'btn-theme',
      text: state.theme === 'dark' ? 'Light mode' : 'Dark mode',
    });
    themeBtn.addEventListener('click', () => {
      state.theme = state.theme === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', state.theme);
      saveState();
      render();
    });
    const scratchBtn = el('button', {
      type: 'button',
      className: 'btn-theme btn-scratch',
      text: 'Scratchpad',
      'aria-pressed': state.scratchOpen ? 'true' : 'false',
    });
    scratchBtn.addEventListener('click', () => {
      state.scratchOpen = !state.scratchOpen;
      saveState();
      render();
    });
    header.appendChild(scratchBtn);
    header.appendChild(themeBtn);
    root.appendChild(header);

    const shellClass =
      'app-shell' + (showScratch && wideScratch ? ' scratch-open' : '');
    const shell = el('div', { className: shellClass });
    renderRail(shell);
    const panel = el('main', { className: 'panel' });
    let scratchMountPt = null;

    if (showScratch && !wideScratch) {
      scratchMountPt = buildScratchBlock(panel);
    }

    if (view.kind === 'overview') renderOverview(panel);
    else if (view.kind === 'module') {
      const mod = COURSE.modules.find((m) => m.id === view.id);
      if (mod) renderModule(mod, panel);
    } else if (view.kind === 'review') renderReview(panel);
    else if (view.kind === 'log') renderErrorLog(panel);
    else if (view.kind === 'drill') renderDrill(panel);

    shell.appendChild(panel);
    if (showScratch && wideScratch) {
      scratchMountPt = buildScratchColumn(shell);
    }
    root.appendChild(shell);

    if (scratchMountPt) {
      attachScratchMount(scratchMountPt, padKey);
    }
  }

  loadState();
  window
    .matchMedia('(min-width: 1200px)')
    .addEventListener('change', () => render());
  render();
})();

  </script>
</body>
</html>
